name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            extension: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            extension: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            extension: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            extension: zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      ARCHIVE: dist/jafix-${{ matrix.target }}.${{ matrix.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "jafix") | .version')
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'Expected release tag v%s for Cargo.toml, got %s\n' "$version" "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          printf 'JAFIX_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Install musl-tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add "$TARGET"
      - name: Run tests
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo test --release --locked --target "$TARGET"
      # scripts/package.sh がcrateのライセンスの一覧を作るのに使う。
      # 0.9系は、cli のfeatureを付けないとコマンドが入らない
      - name: Install cargo-about
        run: cargo install --locked cargo-about@0.9.3 --features cli
      - run: scripts/package.sh "$TARGET"
      - name: Check packaged binary and licenses
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          if [[ "$RUNNER_OS" == Windows ]]; then
            work=$(cygpath -m "$work")
            python -m zipfile -e "$ARCHIVE" "$work"
            binary=jafix.exe
          else
            tar -xzf "$ARCHIVE" -C "$work"
            binary=jafix
          fi
          test "$("$work/$binary" --version)" = "jafix $JAFIX_VERSION"
          for file in CRATE_LICENSES.txt LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md; do
            test -s "$work/$file"
          done
          printf 'これは（確認）です。\n' > "$work/smoke.md"
          XDG_CONFIG_HOME="$work/config" "$work/$binary" fix "$work/smoke.md"
          test "$(cat "$work/smoke.md")" = 'これは(確認)です。'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jafix-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jafix-*
          path: dist
          merge-multiple: true
      - name: Prepare release assets
        working-directory: dist
        run: |
          cp ../scripts/install.sh .
          sha256sum jafix-*.tar.gz jafix-*.zip install.sh > checksums.txt
      - name: Create GitHub Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          options=(--verify-tag --generate-notes)
          tag_type=$(git cat-file -t "refs/tags/$TAG")
          if [[ "$tag_type" == tag ]]; then
            notes=$(git for-each-ref --format='%(contents)' "refs/tags/$TAG")
            signature=$(git for-each-ref --format='%(contents:signature)' "refs/tags/$TAG")
            options+=(--notes "${notes%"$signature"}")
          fi
          if [[ "${TAG%%+*}" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$TAG" "${options[@]}" jafix-*.tar.gz jafix-*.zip install.sh checksums.txt
