# scripts/package.sh が、binaryにリンクされるcrateのライセンスの一覧 CRATE_LICENSES.txt を作るのに使う設定。
# 依存を足して、ここに無いライセンスのcrateが入ると、cargo about generate が失敗する。
# 依存を変えたら `cargo about generate --frozen --fail about.hbs -o /dev/null` で確かめる (targetを指定しないと全OSの依存を見る)。
# ライセンスを選べるcrateは、この並びで先にあるものが選ばれる
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# MPL-2.0とCDLA-Permissive-2.0は、一覧に載せるだけでは満たせない条件があり、THIRD_PARTY_NOTICES.md にソースの入手先や説明を書いている。
# 書き忘れに気づけるよう、全体では許可せず、書いたcrateにだけ許可する
[spellbook]
accepted = ["MPL-2.0"]

[webpki-roots]
accepted = ["CDLA-Permissive-2.0"]

# 以下のclarifyは、cargo-aboutがライセンスのファイルを正しく拾えないcrateに、載せるファイルを指定する。
# checksumはファイルのSHA-256で、start・endを付けた項目では、切り出した範囲のSHA-256である。crateのversionを上げてその中身が変わると、cargo about generate はWARNを出してclarifyを使わずに作る。
# scripts/package.sh はWARNが出ると止まるので、ファイルの中身を確かめてchecksumを書き直す

# ringは、clarifyが無いとソースのファイルの先頭のライセンスの表示も拾い、コードごと一覧に載るので、載せるファイルと範囲を指定する
[ring.clarify]
license = "Apache-2.0 AND ISC"

[[ring.clarify.files]]
path = "LICENSE-other-bits"
license = "ISC"
checksum = "f025ccfb7dfb6bdfedc75ca0f67acc69e6fb4998143d834f7c2f38a29989680f"

[[ring.clarify.files]]
path = "LICENSE-BoringSSL"
license = "Apache-2.0"
checksum = "005fc765ddc5115da796cca915baa9557abae13ff35e0a47c47affc56f6c414d"

# curve25519とp256のCのコードが含む、fiat-cryptoが生成したコード。全targetでbuildされる
[[ring.clarify.files]]
path = "third_party/fiat/LICENSE"
license = "Apache-2.0"
checksum = "9eacbcb81be660840c714a560a9d65ba07913db98dd4baf969f78dd499fdd60f"

# ringの LICENSE によると、BoringSSL由来のISCのコードなどは、ファイルの先頭に著作権表示がある。
# LICENSE-other-bits はBrian Smithの表示だけなので、ほかの著作権者の表示があるファイルから、先頭の表示を載せる。
# 著作権者と年の組ごとに、3つのtargetでbuildされるファイルを1つずつ選んでいる (ring の build.rs の RING_SRCS と、src/ のmoduleのcfgで確かめた)
[[ring.clarify.files]]
path = "crypto/poly1305/poly1305.c"
license = "ISC"
start = "Copyright"
end = "PERFORMANCE OF THIS SOFTWARE."
checksum = "ed6813e62aea0e5af661f769415dc44e1d316c37487634181661d9c2ea974391"

