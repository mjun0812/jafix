<svg xmlns="http://www.w3.org/2000/svg" width="720" height="156" viewBox="0 0 720 156" role="img" aria-labelledby="title desc">
<title id="title">2.2.3.一部の助数詞の表記 の例</title>
<desc id="desc">例文: 3ヶ月ごとに更新し、6か月で廃止します。</desc>
<style>text{fill:#1f2328}.w{font:22px "Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;text-anchor:middle}.n{font:22px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-anchor:middle}.c{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-anchor:middle}.l{font:13px "Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;fill:#59636e}.r{fill:#cf222e}.g{fill:#116329}.q{fill:#8c959f}</style>
<rect x="0.5" y="0.5" width="719" height="155" rx="8" fill="#ffffff" stroke="#d1d9e0"/>
<path d="M1 46V9a8 8 0 0 1 8-8h702a8 8 0 0 1 8 8v37z" fill="#f6f8fa"/>
<path d="M1 46.5h718M1 112.5h718" stroke="#d1d9e0"/>
<text x="24" y="29" style='font:600 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>2.2.3.一部の助数詞の表記</text>
<rect x="225" y="13" width="44" height="22" rx="11" fill="#fff8c5"/>
<text x="247" y="28.5" style='font:600 12px "Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;text-anchor:middle;fill:#9a6700'>指摘</text>
<text class="l" x="24" y="83">例文</text>
<rect x="104" y="63" width="13.2" height="29" rx="3" fill="#ffcecb"/>
<text class="n r" x="110.6" y="84">3</text>
<rect x="117.2" y="63" width="22" height="29" rx="3" fill="#ffcecb"/>
<text class="w r" x="128.2" y="84">ヶ</text>
<rect x="139.2" y="63" width="22" height="29" rx="3" fill="#ffcecb"/>
<text class="w r" x="150.2" y="84">月</text>
<text class="w" x="172.2" y="84">ご</text>
<text class="w" x="194.2" y="84">と</text>
<text class="w" x="216.2" y="84">に</text>
<text class="w" x="238.2" y="84">更</text>
<text class="w" x="260.2" y="84">新</text>
<text class="w" x="282.2" y="84">し</text>
<text class="w" x="304.2" y="84">、</text>
<text class="n" x="321.8" y="84">6</text>
<text class="w" x="339.4" y="84">か</text>
<text class="w" x="361.4" y="84">月</text>
<text class="w" x="383.4" y="84">で</text>
<text class="w" x="405.4" y="84">廃</text>
<text class="w" x="427.4" y="84">止</text>
<text class="w" x="449.4" y="84">し</text>
<text class="w" x="471.4" y="84">ま</text>
<text class="w" x="493.4" y="84">す</text>
<text class="w" x="515.4" y="84">。</text>
<text class="l" x="24" y="138">「3ヶ月」を「3か月」にする</text>
<text class="l" x="696" y="138" style="text-anchor:end">1か所</text>
</svg>
