<svg xmlns="http://www.w3.org/2000/svg" width="720" height="156" viewBox="0 0 720 156" role="img" aria-labelledby="title desc">
<title id="title">date-weekday-mismatch の例</title>
<desc id="desc">例文: 候補は2026年12月1日(火)と2026年12月4日(木)です。</desc>
<style>text{fill:#1f2328}.w{font:22px "Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;text-anchor:middle}.n{font:22px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-anchor:middle}.c{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-anchor:middle}.l{font:13px "Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;fill:#59636e}.r{fill:#cf222e}.g{fill:#116329}.q{fill:#8c959f}</style>
<rect x="0.5" y="0.5" width="719" height="155" rx="8" fill="#ffffff" stroke="#d1d9e0"/>
<path d="M1 46V9a8 8 0 0 1 8-8h702a8 8 0 0 1 8 8v37z" fill="#f6f8fa"/>
<path d="M1 46.5h718M1 112.5h718" stroke="#d1d9e0"/>
<text x="24" y="29" style='font:600 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>date-weekday-mismatch</text>
<rect x="225" y="13" width="44" height="22" rx="11" fill="#fff8c5"/>
<text x="247" y="28.5" style='font:600 12px "Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;text-anchor:middle;fill:#9a6700'>指摘</text>
<text class="l" x="24" y="83">例文</text>
<text class="w" x="115" y="84">候</text>
<text class="w" x="137" y="84">補</text>
<text class="w" x="159" y="84">は</text>
<text class="n" x="176.6" y="84">2</text>
<text class="n" x="189.8" y="84">0</text>
<text class="n" x="203" y="84">2</text>
<text class="n" x="216.2" y="84">6</text>
<text class="w" x="233.8" y="84">年</text>
<text class="n" x="251.4" y="84">1</text>
<text class="n" x="264.6" y="84">2</text>
<text class="w" x="282.2" y="84">月</text>
<text class="n" x="299.8" y="84">1</text>
<text class="w" x="317.4" y="84">日</text>
<text class="n" x="335" y="84">(</text>
<text class="w" x="352.6" y="84">火</text>
<text class="n" x="370.2" y="84">)</text>
<text class="w" x="387.8" y="84">と</text>
<text class="n" x="405.4" y="84">2</text>
<text class="n" x="418.6" y="84">0</text>
<text class="n" x="431.8" y="84">2</text>
<text class="n" x="445" y="84">6</text>
<text class="w" x="462.6" y="84">年</text>
<text class="n" x="480.2" y="84">1</text>
<text class="n" x="493.4" y="84">2</text>
<text class="w" x="511" y="84">月</text>
<text class="n" x="528.6" y="84">4</text>
<text class="w" x="546.2" y="84">日</text>
<text class="n" x="563.8" y="84">(</text>
<rect x="570.4" y="63" width="22" height="29" rx="3" fill="#ffcecb"/>
<text class="w r" x="581.4" y="84">木</text>
<text class="n" x="599" y="84">)</text>
<text class="w" x="616.6" y="84">で</text>
<text class="w" x="638.6" y="84">す</text>
<text class="w" x="660.6" y="84">。</text>
<text class="l" x="24" y="138">「2026年12月4日(」の曜日は「金」で、「木」ではない</text>
<text class="l" x="696" y="138" style="text-anchor:end">1か所</text>
</svg>
