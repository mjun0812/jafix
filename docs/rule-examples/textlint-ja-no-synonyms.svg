<text class="w" x="291" y="84">す</text>
<text class="w" x="313" y="84">。</text>
<text class="w" x="335" y="84">次</text>
<text class="w" x="357" y="84">に</text>
<rect x="368" y="63" width="22" height="29" rx="3" fill="#ffcecb"/>
<text class="w r" x="379" y="84">サ</text>
<rect x="390" y="63" width="22" height="29" rx="3" fill="#ffcecb"/>
<text class="w r" x="401" y="84">ー</text>
<rect x="412" y="63" width="22" height="29" rx="3" fill="#ffcecb"/>
<text class="w r" x="423" y="84">バ</text>
