text = "『a』』"
findings = ["1:4"]
messages = ["』 に対応する 『 が無い"]

[[cases]]
name = "nk-closing-before-opening"
text = "』a『"
findings = ["1:1", "1:3"]
messages = ["』 に対応する 『 が無い", "『 に対応する 』 が無い"]

[[cases]]
