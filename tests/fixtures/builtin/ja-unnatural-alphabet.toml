# ja-unnatural-alphabet の例。期待値は、textlint 15.8.0 と textlint-rule-preset-ja-technical-writing 12.0.2 の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所である。
#
# name:     caseの名前
# builtin:  設定ファイルの [builtin] の表に書く内容 (省略可)
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    修正ルールだけが持つ。`jafix fix` の後の内容から、末尾の改行を除いたもの

[[cases]]
name = "ua-basic"
text = "あgい"
findings = ["1:2"]
messages = ["不自然なアルファベットがある: g"]

[[cases]]
name = "ua-allow-default"
text = "あaいnうAえ。"
findings = []

[[cases]]
name = "ua-miss"
text = "あgいhう。"
findings = ["1:2"]

[[cases]]
name = "ua-common"
text = "のC言語とx軸とy座標とEメール。"
findings = []

[[cases]]
name = "ua-fullwidth-x"
text = "のｘ軸です。"
findings = ["1:2"]

[[cases]]
name = "ua-after-allow"
text = "C言語gを使う。"
findings = []

[[cases]]
name = "ua-em"
text = "*あgい*です。"
findings = ["1:3"]

[[cases]]
name = "ua-quote"
text = "> あgいです。"
findings = ["1:4"]

[[cases]]
name = "ua-code"
text = "`あgい`です。"
findings = []

[[cases]]
name = "ua-allow-opt"
builtin = 'ja-unnatural-alphabet = { allow = ["g"] }'
text = "あgいとあaい"
findings = ["1:6"]

[[cases]]
name = "ua-common-off"
builtin = 'ja-unnatural-alphabet = { allowCommonCase = false }'
text = "のx軸です。"
findings = ["1:2"]

[[cases]]
name = "ua-emoji"
text = "😀gい"
findings = ["1:2"]

[[cases]]
name = "ua-fullwidth"
text = "ＡＢＣ"
findings = ["1:2"]

[[cases]]
name = "ua-words"
text = "これはgitです。"
findings = []

[[cases]]
name = "ua-punct"
text = "、gを。"
findings = ["1:2"]
