# no-doubled-joshi の例。期待値は、textlint 15.8.0 と textlint-rule-preset-ja-technical-writing 12.0.2 の実行結果のうち、
# kuromojinとlinderaのトークンが同じ入力のものから作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所で、期待値はjafixの規則から決めた。
#
# name:     caseの名前
# builtin:  設定ファイルの [builtin] の表に書く内容 (省略可)
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)

[[cases]]
name = "joshi-wa"
text = "私は本は読む。"
findings = ["1:4"]
messages = ["同じ助詞「は」が続いている"]

[[cases]]
name = "joshi-comma"
text = "私は、本は読む。"
findings = []

[[cases]]
name = "joshi-comma-strict"
builtin = 'no-doubled-joshi = { min_interval = 1, strict = true }'
text = "私は、本は読む。"
findings = ["1:5"]

[[cases]]
name = "joshi-interval-2"
builtin = 'no-doubled-joshi = { min_interval = 2 }'
text = "私は、本は読む。"
findings = ["1:5"]

[[cases]]
name = "joshi-paren"
text = "私は（本）は読む。"
findings = []

[[cases]]
name = "joshi-paren-interval-3"
builtin = 'no-doubled-joshi = { min_interval = 3 }'
text = "私は（本）は読む。"
findings = ["1:6"]

[[cases]]
name = "joshi-half-paren"
text = "私は(本)は読む。"
findings = ["1:6"]

[[cases]]
name = "joshi-rentaika"
text = "私の本の表紙。"
findings = []

[[cases]]
name = "joshi-wo"
text = "本を読み絵を見る。"
findings = []

[[cases]]
name = "joshi-te"
text = "走って食べて寝る。"
findings = []

[[cases]]
name = "joshi-heiritsu-2"
text = "犬や猫や鳥がいる。"
findings = []

[[cases]]
name = "joshi-heiritsu-3"
text = "犬と猫と鳥と魚。"
findings = ["1:4", "1:6"]
messages = ["同じ助詞「と」が続いている", "同じ助詞「と」が続いている"]

[[cases]]
name = "joshi-kadouka"
text = "行くかどうかを決めるか。"
findings = []

[[cases]]
name = "joshi-ka"
text = "行くか帰るか決める。"
findings = ["1:6"]

[[cases]]
name = "joshi-merged"
text = "駅には店には人がいる。"
findings = ["1:5"]
messages = ["同じ助詞「には」が続いている"]

[[cases]]
name = "joshi-allow"
builtin = 'no-doubled-joshi = { min_interval = 1, allow = ["は"] }'
text = "私は本は読む。"
findings = []

[[cases]]
name = "joshi-allow-merged"
builtin = 'no-doubled-joshi = { min_interval = 1, allow = ["は"] }'
text = "駅には店には人がいる。"
findings = ["1:5"]

[[cases]]
name = "joshi-separator-default"
text = "私は；本は読む。"
findings = ["1:5"]

[[cases]]
name = "joshi-separator-option"
builtin = 'no-doubled-joshi = { min_interval = 1, separatorCharacters = [".", "．", "。", "?", "!", "？", "！", "；"] }'
text = "私は；本は読む。"
findings = []

[[cases]]
name = "joshi-comma-characters"
builtin = 'no-doubled-joshi = { min_interval = 1, commaCharacters = ["，"] }'
text = "私は、本は読む。"
findings = ["1:5"]

[[cases]]
name = "joshi-bracket-kuten"
text = "彼は「本は。本は」と言った。"
findings = []

[[cases]]
name = "joshi-bracket-kuten-strict"
builtin = 'no-doubled-joshi = { min_interval = 1, strict = true }'
text = "彼は「本は。本は」と言った。"
findings = ["1:5", "1:8"]

[[cases]]
name = "joshi-sentences"
text = "私は走る。本は読む。"
findings = []

[[cases]]
name = "joshi-second-sentence"
text = "前の文です。私は本は読む。"
findings = ["1:10"]

[[cases]]
name = "joshi-multiline"
text = "私は\n本は読む。"
findings = ["2:2"]

[[cases]]
name = "joshi-paragraphs"
text = "私は\n\n本は読む。"
findings = []

[[cases]]
name = "joshi-list"
text = "- 私は本は読む。"
findings = ["1:6"]

[[cases]]
name = "joshi-quote"
text = "> 私は本は読む。"
findings = []

[[cases]]
name = "joshi-heading"
text = "# 私は本は読む。"
findings = []

[[cases]]
name = "joshi-table"
text = "| 私は本は読む。 |\n| --- |"
findings = []

[[cases]]
name = "joshi-footnote"
text = "本文です[^1]。\n\n[^1]: 私は本は読む。"
findings = ["3:10"]

[[cases]]
name = "joshi-link"
text = "[私は本は読む](https://example.com)。"
findings = ["1:5"]

[[cases]]
name = "joshi-code-twice"
text = "`x`は`y`は読む。"
findings = ["1:8"]

[[cases]]
name = "joshi-surrogate"
note = "textlintは前にある絵文字の分だけ1文字左の `は` に出す (1:3)。jafixは2つ目の `は` の位置に出す"
text = "\U0001f600は本は読む。"
findings = ["1:4"]

[[cases]]
name = "joshi-same-lines"
note = "textlintは3つ目の組の位置を前の出現に写し、2つ目の組と重なって消える (2:2と4:2)。jafixは3つの組のそれぞれの後ろの `は` に出す"
text = "私は\n私は\n私は\n私は読む。"
findings = ["2:2", "3:2", "4:2"]
