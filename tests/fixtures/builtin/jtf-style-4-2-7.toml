# 4.2.7.コロン(：) の例。期待値は、textlint 15.8.0 と textlint-rule-preset-jtf-style 3.0.3 の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所か、既存の修正ルールと組み合わさる箇所で、期待値は設計の規則から決めた。
#
# rule:     指摘の行の `[<rule-id>]` のID (fixtureのファイル名はIDを使えないので、ここに書く)
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を全caseに当て、caseに書けばそちらだけを使う
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘と箇所の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    修正ルールだけが持つ。`jafix fix` の後の内容から、末尾の改行を除いたもの。2回目の `jafix fix` で変わらないことも確かめる

rule = "4.2.7.コロン(：)"
builtin = '''
"4.2.7.コロン(：)" = true
'''

[[cases]]
name = "co-no-space"
text = "例:これ"
findings = ["1:2"]
messages = ["コロンは全角の「：」にする"]

[[cases]]
name = "co-space-after"
text = "例: これ"
findings = ["1:2"]
messages = ["コロンは全角の「：」にする"]

[[cases]]
name = "co-japanese-then-english"
text = "日本語:English"
findings = ["1:4"]
messages = ["コロンは全角の「：」にする"]

[[cases]]
name = "co-end"
text = "例:"
findings = ["1:2"]
messages = ["コロンは全角の「：」にする"]

[[cases]]
name = "co-hiragana-katakana"
text = "ひらがな:とカタカナ:"
findings = ["1:5", "1:11"]
messages = ["コロンは全角の「：」にする", "コロンは全角の「：」にする"]

