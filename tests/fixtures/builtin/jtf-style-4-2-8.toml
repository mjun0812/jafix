# 4.2.8.セミコロン(;) の例。期待値は、textlint 15.8.0 と textlint-rule-preset-jtf-style 3.0.3 の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所か、既存の修正ルールと組み合わさる箇所で、期待値は設計の規則から決めた。
#
# rule:     指摘の行の `[<rule-id>]` のID (fixtureのファイル名はIDを使えないので、ここに書く)
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を全caseに当て、caseに書けばそちらだけを使う
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘と箇所の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    修正ルールだけが持つ。`jafix fix` の後の内容から、末尾の改行を除いたもの。2回目の `jafix fix` で変わらないことも確かめる

rule = "4.2.8.セミコロン(;)"
builtin = '''
"4.2.8.セミコロン(;)" = true
'''

[[cases]]
name = "sc-basic"
text = "日本語;です"
findings = ["1:4"]
messages = ["和文にセミコロン「;」を使わない"]

[[cases]]
name = "sc-end"
text = "日本語;"
findings = ["1:4"]
messages = ["和文にセミコロン「;」を使わない"]

[[cases]]
name = "sc-english"
text = "a; b"
findings = []

[[cases]]
name = "sc-english-before-japanese"
text = "a;日本語"
findings = []

[[cases]]
name = "sc-fullwidth-is-allowed"
text = "日本語；です"
findings = []

[[cases]]
name = "sc-hiragana-katakana"
text = "ひらがな;とカタカナ;"
findings = ["1:5", "1:11"]
messages = ["和文にセミコロン「;」を使わない", "和文にセミコロン「;」を使わない"]

[[cases]]
name = "sc-long-vowel-is-not-japanese"
text = "サーバー;"
findings = []

[[cases]]
name = "sc-repetition-mark-is-japanese"
text = "人々;"
findings = ["1:3"]
messages = ["和文にセミコロン「;」を使わない"]

[[cases]]
name = "sc-surrogate-pair-kanji"
text = "\U00020bb7;"
findings = ["1:2"]
messages = ["和文にセミコロン「;」を使わない"]

[[cases]]
name = "sc-code-ending"
text = "int x = 1;"
findings = []

[[cases]]
name = "sc-two-lines"
text = "日本語;\n日本語;"
findings = ["1:4", "2:4"]
messages = ["和文にセミコロン「;」を使わない", "和文にセミコロン「;」を使わない"]

[[cases]]
name = "sc-after-inline-code"
text = "`x`;日本語"
findings = []

[[cases]]
name = "sc-heading"
text = "# 日本語;です"
findings = []

[[cases]]
name = "sc-quote"
text = "> 日本語;です"
findings = []

[[cases]]
name = "sc-table"
text = "| 列 |\n| - |\n| 日本語;です |"
findings = []

[[cases]]
name = "sc-list"
text = "- 日本語;です"
findings = ["1:6"]
messages = ["和文にセミコロン「;」を使わない"]

[[cases]]
name = "sc-link"
text = "[日本語;です](https://example.com)"
findings = []

[[cases]]
name = "sc-strong"
text = "**日本語;です**"
findings = []

[[cases]]
name = "sc-emphasis"
text = "*日本語;です*"
findings = []

[[cases]]
name = "sc-strike"
text = "~~日本語;です~~"
findings = []

[[cases]]
name = "sc-code"
text = "`日本語;です`"
findings = []

[[cases]]
name = "sc-footnote"
text = "[^1]: 日本語;です"
findings = ["1:10"]
messages = ["和文にセミコロン「;」を使わない"]

[[cases]]
name = "sc-html"
text = "<span>日本語;です</span>"
findings = ["1:10"]
messages = ["和文にセミコロン「;」を使わない"]
