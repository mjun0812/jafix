name = "w-weasel-phrase"
text = "This is a number of items."
findings = ["1:6", "1:9"]
messages = ["「is a number」は曖昧な語である(weasel)", "「a number of」は冗長か不要な句である(tooWordy)"]

[[cases]]
name = "w-weasel-word-inside"
