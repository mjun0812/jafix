# write-good の例。期待値は、textlint 15.8.0 と textlint-rule-write-good 2.0.0 (write-good 1.0.8) の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所か、Markdownの解析の違いが出る箇所で、期待値は設計の規則から決めた。
# 指摘の範囲は提案の範囲 (当たった文字列の全体) で、位置はtextlintと同じである。範囲が同じ提案は1件にまとめ、文面を検査の順につなぐ。
#
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を、builtin を持たない全caseに当てる
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)

builtin = 'write-good = true'

[[cases]]
name = "w-weasel"
text = "It is clearly wrong."
findings = ["1:1", "1:7"]
messages = ["「It is」は冗長か不要な句である(tooWordy)", "「clearly」は曖昧な語、意味を弱める語である(weasel・adverb)"]

[[cases]]
name = "w-weasel-upper"
text = "It is CLEARLY wrong."
findings = ["1:1", "1:7"]
messages = ["「It is」は冗長か不要な句である(tooWordy)", "「CLEARLY」は曖昧な語、意味を弱める語である(weasel・adverb)"]

[[cases]]
name = "w-weasel-too-many"
text = "We have too many items."
findings = ["1:13"]
messages = ["「many」は意味を弱める語である(adverb)"]

[[cases]]
name = "w-weasel-too-many-capital"
text = "Too many items are here."
findings = ["1:5"]
messages = ["「many」は曖昧な語、意味を弱める語である(weasel・adverb)"]

[[cases]]
name = "w-weasel-many"
text = "We have many items."
findings = ["1:9"]
messages = ["「many」は曖昧な語、意味を弱める語である(weasel・adverb)"]

[[cases]]
name = "w-weasel-too-few"
text = "We have too few items."
findings = []

