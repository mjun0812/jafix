name = "w-weasel-text-start-too"
note = "`few` が本文の範囲の先頭から4文字未満にあると、textlintは範囲の末尾の4文字を直前の4文字として比べ、末尾が `too ` なので外す。jafixは直前の文字だけを見るので外さない"
text = "Few are too *odd*."
findings = ["1:1"]
messages = ["「Few」は曖昧な語である(weasel)"]

