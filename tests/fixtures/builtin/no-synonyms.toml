# @textlint-ja/no-synonyms の例。期待値は、textlint 15.8.0、@textlint-ja/textlint-rule-no-synonyms 1.3.0、sudachi-synonyms-dictionary 20.0.0 の実行結果から作った。
# 語の区切りは、textlintが tiny-segmenter、jafixが lindera のトークンをつなげた最長一致で、見出しに当たる語が同じ入力は、textlintの結果と使われた表記と集まりが同じになる。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所で、期待値はjafixの規則から決めた。
# 集まりの指摘は、textlintが集まりにつき1件、jafixが使われた表記ごとに最後の出現に1件ずつなので、集まりを指摘するcaseは note を持つ。
#
# rule:     指摘の行の `[<rule-id>]` に出るルールのID。ファイル名と違うので書く (省略するとファイル名)
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭の builtin は全caseに当たり、caseに builtin があればその代わりに使う (省略可)
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)

rule = "@textlint-ja/no-synonyms"
builtin = '"@textlint-ja/no-synonyms" = true'

[[cases]]
name = "basic-pair"
note = "textlintは同義語の集まりにつき1件を、最初に出たのが最も遅い表記の最後の出現に指摘するが、jafixは使われた表記ごとに、その表記が文書の中で最後に出た位置に1件ずつ指摘する"
text = "サーバを起動する。サーバーを停止する。"
findings = ["1:1", "1:10"]
messages = ["同義語の「サーバ」と「サーバー」が混ざっている", "同義語の「サーバ」と「サーバー」が混ざっている"]

