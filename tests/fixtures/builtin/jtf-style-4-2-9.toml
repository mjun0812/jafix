# 4.2.9.ダッシュ(-) の例。期待値は、textlint 15.8.0 と textlint-rule-preset-jtf-style 3.0.3 の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所か、既存の修正ルールと組み合わさる箇所で、期待値は設計の規則から決めた。
#
# rule:     指摘の行の `[<rule-id>]` のID (fixtureのファイル名はIDを使えないので、ここに書く)
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を全caseに当て、caseに書けばそちらだけを使う
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘と箇所の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    修正ルールだけが持つ。`jafix fix` の後の内容から、末尾の改行を除いたもの。2回目の `jafix fix` で変わらないことも確かめる

rule = "4.2.9.ダッシュ(-)"
builtin = '''
"4.2.9.ダッシュ(-)" = true
'''

[[cases]]
name = "ds-em-dash"
text = "日本語—です"
findings = ["1:4"]
messages = ["和文にダッシュ「—」を使わない"]

[[cases]]
name = "ds-horizontal-bar"
text = "日本語―です"
findings = ["1:4"]
messages = ["和文にダッシュ「―」を使わない"]

[[cases]]
name = "ds-en-dash"
text = "日本語–です"
findings = ["1:4"]
messages = ["和文にダッシュ「–」を使わない"]

[[cases]]
name = "ds-figure-dash"
text = "日本語‒です"
findings = ["1:4"]
messages = ["和文にダッシュ「‒」を使わない"]

[[cases]]
name = "ds-double-dash"
text = "日本語――です"
findings = ["1:4"]
messages = ["和文にダッシュ「―」を使わない"]

[[cases]]
name = "ds-triple-dash"
text = "日本語———です"
findings = ["1:4"]
messages = ["和文にダッシュ「—」を使わない"]

[[cases]]
name = "ds-english-both"
text = "a — b"
findings = []

[[cases]]
name = "ds-english-before"
text = "English—日本語"
findings = []

[[cases]]
name = "ds-japanese-before-only"
text = "日本語—English"
findings = ["1:4"]
messages = ["和文にダッシュ「—」を使わない"]

[[cases]]
name = "ds-minus-sign-is-not-dash"
text = "日本語−です"
findings = []

[[cases]]
name = "ds-hyphen-is-not-dash"
text = "日本語-です"
findings = []

[[cases]]
name = "ds-long-vowel-is-not-dash"
text = "サーバーです"
findings = []

[[cases]]
name = "ds-hiragana-katakana"
text = "ひらがな—とカタカナ―"
findings = ["1:5", "1:11"]
messages = ["和文にダッシュ「—」を使わない", "和文にダッシュ「―」を使わない"]

[[cases]]
name = "ds-repetition-mark-is-japanese"
text = "人々—"
findings = ["1:3"]
messages = ["和文にダッシュ「—」を使わない"]

[[cases]]
name = "ds-surrogate-pair-kanji"
text = "\U00020bb7—"
findings = ["1:2"]
messages = ["和文にダッシュ「—」を使わない"]

[[cases]]
name = "ds-two-lines"
text = "日本語—\n日本語―"
findings = ["1:4", "2:4"]
messages = ["和文にダッシュ「—」を使わない", "和文にダッシュ「―」を使わない"]

[[cases]]
name = "ds-after-inline-code"
text = "`x`—日本語"
findings = []

[[cases]]
name = "ds-heading"
text = "# 日本語—です"
findings = []

[[cases]]
name = "ds-quote"
text = "> 日本語—です"
findings = []

[[cases]]
name = "ds-table"
text = "| 列 |\n| - |\n| 日本語—です |"
findings = []

[[cases]]
name = "ds-list"
text = "- 日本語—です"
findings = ["1:6"]
messages = ["和文にダッシュ「—」を使わない"]

[[cases]]
name = "ds-link"
text = "[日本語—です](https://example.com)"
findings = []

[[cases]]
name = "ds-strong"
text = "**日本語—です**"
findings = []

[[cases]]
name = "ds-emphasis"
text = "*日本語—です*"
findings = []

[[cases]]
name = "ds-strike"
text = "~~日本語—です~~"
findings = []

[[cases]]
name = "ds-code"
text = "`日本語—です`"
findings = []

[[cases]]
name = "ds-footnote"
text = "[^1]: 日本語—です"
findings = ["1:10"]
messages = ["和文にダッシュ「—」を使わない"]

[[cases]]
name = "ds-html"
text = "<span>日本語—です</span>"
findings = ["1:10"]
messages = ["和文にダッシュ「—」を使わない"]
