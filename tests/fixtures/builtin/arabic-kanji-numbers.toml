# arabic-kanji-numbers の例。期待値は、textlint 15.8.0 と textlint-rule-preset-ja-technical-writing 12.0.2 の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所である。
#
# name:     caseの名前
# builtin:  設定ファイルの [builtin] の表に書く内容 (省略可)
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    修正ルールだけが持つ。`jafix fix` の後の内容から、末尾の改行を除いたもの

[[cases]]
name = "ak-basic"
text = "二回実行する。"
findings = ["1:1"]
messages = ["算用数字で書く: 二回"]

[[cases]]
name = "ak-first-only"
text = "十一回と二回。"
findings = ["1:1"]

[[cases]]
name = "ak-ignore"
text = "数十万と一万。"
findings = []

[[cases]]
name = "ak-rev"
text = "世界1の技術。"
findings = ["1:1"]
messages = ["漢数字で書く: 世界1"]

[[cases]]
name = "ak-shu"
text = "と1種と11種類と1種類。"
findings = ["1:1"]
messages = ["漢数字で書く: と1種"]

[[cases]]
name = "ak-shu-head"
text = "1種のみ。"
findings = []

[[cases]]
name = "ak-shu-rui"
text = "この1種類だけ。"
findings = []

[[cases]]
name = "ak-list"
text = "- 二回"
findings = ["1:3"]

[[cases]]
name = "ak-heading"
text = "# 第一章"
findings = []

[[cases]]
name = "ak-strong"
text = "**二回**です。"
findings = []

[[cases]]
name = "ak-quote"
text = "> 二回です。"
findings = []

[[cases]]
name = "ak-table"
text = "| 列 |\n| - |\n| 二回 |"
findings = []

[[cases]]
name = "ak-link"
text = "[二回](u)です。"
findings = []

[[cases]]
name = "ak-dai"
text = "第一章と第二節。"
findings = ["1:1", "1:5"]

[[cases]]
name = "ak-crash"
note = "textlintは例外で検査全体が止まる。jafixは止まらずに指摘する"
text = "十十回です。"
findings = ["1:1"]

[[cases]]
name = "ak-tsu"
text = "三つのものと二つ目。"
findings = ["1:1"]

[[cases]]
name = "ak-tsu-ignore"
text = "一つ返事で三つ。"
findings = []
