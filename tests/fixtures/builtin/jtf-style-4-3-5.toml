# 4.3.5.二重引用符 の例。期待値は、textlint 15.8.0 と textlint-rule-preset-jtf-style 3.0.3 の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所か、既存の修正ルールと組み合わさる箇所で、期待値は設計の規則から決めた。
#
# rule:     指摘の行の `[<rule-id>]` のID (fixtureのファイル名はIDを使えないので、ここに書く)
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を全caseに当て、caseに書けばそちらだけを使う
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘と箇所の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    修正ルールだけが持つ。`jafix fix` の後の内容から、末尾の改行を除いたもの。2回目の `jafix fix` で変わらないことも確かめる

rule = "4.3.5.二重引用符"
builtin = '''
"4.3.5.二重引用符" = true
'''

[[cases]]
name = "dq-opening-only"
text = "\"これは"
findings = ["1:1"]
messages = ["\" に対応する \" が無い"]

[[cases]]
name = "dq-closing-only"
text = "これは\""
findings = ["1:4"]
messages = ["\" に対応する \" が無い"]

[[cases]]
name = "dq-matched"
text = "\"これは\""
findings = []

[[cases]]
name = "dq-matched-then-opening"
text = "\"これは\"と\"あれ"
findings = ["1:7"]
messages = ["\" に対応する \" が無い"]

[[cases]]
name = "dq-matched-twice"
text = "\"あ\"と\"い\""
findings = []

[[cases]]
name = "dq-nested"
text = "\"\"a\"\""
findings = []

[[cases]]
name = "dq-extra-closing"
text = "\"a\"\""
findings = ["1:4"]
messages = ["\" に対応する \" が無い"]

[[cases]]
name = "dq-closing-before-opening"
text = "\"a\""
findings = []

[[cases]]
name = "dq-extra-opening"
text = "\"a\"b\""
findings = ["1:5"]
messages = ["\" に対応する \" が無い"]

[[cases]]
name = "dq-across-paragraphs"
text = "\"これは\n\nあれ\""
findings = ["1:1", "3:3"]
messages = ["\" に対応する \" が無い", "\" に対応する \" が無い"]

[[cases]]
name = "dq-open-in-each-paragraph"
text = "\"これは\n\n\"あれ"
findings = ["1:1", "3:1"]
messages = ["\" に対応する \" が無い", "\" に対応する \" が無い"]

[[cases]]
name = "dq-across-lines-of-a-paragraph"
text = "\"これは\nあれ\""
findings = []

[[cases]]
name = "dq-across-list-items"
text = "- \"b\n- c\""
findings = ["1:3", "2:4"]
messages = ["\" に対応する \" が無い", "\" に対応する \" が無い"]

[[cases]]
name = "dq-in-list-item"
text = "- \"これは"
findings = ["1:3"]
messages = ["\" に対応する \" が無い"]

[[cases]]
name = "dq-quote-is-skipped"
text = "> \"これは"
findings = []

[[cases]]
name = "dq-heading-is-skipped"
text = "# \"見出し"
findings = []

[[cases]]
name = "dq-table-cell-is-skipped"
text = "| 列 |\n| - |\n| \"a |"
findings = []

[[cases]]
name = "dq-footnote"
text = "[^1]: \"これは"
findings = ["1:7"]
messages = ["\" に対応する \" が無い"]

[[cases]]
name = "dq-inline-html"
text = "<span>\"これは</span>"
findings = ["1:7"]
messages = ["\" に対応する \" が無い"]

[[cases]]
name = "dq-around-strong"
text = "\"**強調**\""
findings = []

[[cases]]
name = "dq-opening-before-strong-closing-inside"
text = "\"**強調\"**"
findings = []

[[cases]]
name = "dq-inside-strong"
text = "**\"強調\"**"
findings = []

[[cases]]
name = "dq-opening-inside-strong"
text = "**\"強調**"
findings = ["1:3"]
messages = ["\" に対応する \" が無い"]

[[cases]]
name = "dq-around-emphasis"
text = "\"*強調*\""
findings = []

[[cases]]
name = "dq-opening-inside-emphasis"
text = "*\"強調*"
findings = ["1:2"]
messages = ["\" に対応する \" が無い"]

[[cases]]
name = "dq-around-strike"
text = "\"~~a~~\""
findings = []

[[cases]]
name = "dq-across-strike"
text = "~~\"a~~\""
findings = []

[[cases]]
name = "dq-around-link"
text = "\"[リンク](https://example.com)\""
findings = []

[[cases]]
name = "dq-opening-inside-link-text"
text = "[\"リンク](https://example.com)"
findings = ["1:2"]
messages = ["\" に対応する \" が無い"]

[[cases]]
name = "dq-opening-inside-link-text-closing-outside"
text = "[\"リンク](https://example.com)\""
findings = []

[[cases]]
name = "dq-inside-inline-code-is-not-counted"
text = "\"`\"`"
findings = ["1:1"]
messages = ["\" に対応する \" が無い"]

[[cases]]
name = "dq-around-inline-code"
text = "\"`code`\""
findings = []

[[cases]]
name = "dq-image-alt-is-not-counted"
text = "![\"a](a.png)"
findings = []

[[cases]]
name = "dq-full-reference-link"
text = "[\"あ][r]\n\n[r]: https://example.com"
findings = ["1:2"]
messages = ["\" に対応する \" が無い"]

[[cases]]
name = "dq-shortcut-reference-link"
