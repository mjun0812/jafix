text = "[\"あ]\n\n[\"あ]: https://example.com"
findings = []

[[cases]]
name = "dq-collapsed-reference-link"
note = "定義を持つcollapsed形の参照リンクの文字列は、本文でないので見ない。textlintは見て、対にならない記号を指摘する"
text = "[\"あ][]\n\n[\"あ]: https://example.com"
findings = []

[[cases]]
name = "dq-surrogate-pair-before"
text = "\U00020bb7野家は\"これは"
findings = ["1:5"]
messages = ["\" に対応する \" が無い"]

[[cases]]
name = "dq-after-inline-code"
text = "`x`\"これは"
findings = ["1:4"]
messages = ["\" に対応する \" が無い"]

[[cases]]
name = "dq-no-pair-characters"
text = "これは本です。"
findings = []

[[cases]]
name = "dq-unbalanced-in-bare-url"
note = "裸のURLは本文でないので見ない。textlintはURLの中の記号も数えて、対にならない記号を指摘する"
text = "https://example.com/a\"b"
findings = []

[[cases]]
name = "dq-even-number"
text = "\"a\" and \"b\""
findings = []

[[cases]]
name = "dq-odd-number-flags-the-last"
text = "\"a\" \"b\" \"c"
findings = ["1:9"]
messages = ["\" に対応する \" が無い"]

[[cases]]
name = "dq-three-in-a-row"
