[[cases]]
name = "dq-last-of-each-paragraph"
text = "He said \"hi\" and \"bye\" and \"x\n\n別段落\""
findings = ["1:28", "3:4"]
messages = ["\" に対応する \" が無い", "\" に対応する \" が無い"]

[[cases]]
name = "dq-two-quotes-in-a-row"
text = "\"\""
findings = []

[[cases]]
name = "dq-fullwidth-quotes-are-not-counted"
text = "“これは”"
findings = []

[[cases]]
name = "dq-code-quote-then-quote"
text = "`\"`\""
findings = ["1:4"]
messages = ["\" に対応する \" が無い"]

[[cases]]
name = "dq-in-english-sentence"
text = "Say \"hello\" to \"world\"."
findings = []
