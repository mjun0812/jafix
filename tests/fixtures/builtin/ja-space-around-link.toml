fixed = "ぁ[x](https://example.com)\nん[x](https://example.com)\nゔ [x](https://example.com)\nァ[x](https://example.com)\nヶ[x](https://example.com)\nヷ [x](https://example.com)\n㐀[x](https://example.com)\n䶿[x](https://example.com)\n䷀ [x](https://example.com)\n豈[x](https://example.com)\n﫿[x](https://example.com)"

