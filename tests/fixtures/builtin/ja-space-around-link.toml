[[cases]]
name = "al-bare-url"
note = "裸のURLには当てない。GFMの裸のURLは前が空白か行頭であることを求めるので、前の空白を消すとURLとして読まれず、後ろの空白を消すと続く `です` がURLに入る。textlintは裸のURLの前後の空白も消す"
text = "詳細は https://example.com/a です"
findings = []
fixed = "詳細は https://example.com/a です"

[[cases]]
name = "al-bare-url-true"
builtin = '''
ja-space-around-link = { before = true, after = true }
space-between-ja-and-alnum = false
space-between-ja-and-paren = false
fullwidth-paren = false
'''
text = "詳細は https://example.com/a です"
findings = []

[[cases]]
name = "al-full-reference"
text = "日本語 [x][r] 日本語\n\n[r]: https://example.com"
findings = []
fixed = "日本語 [x][r] 日本語\n\n[r]: https://example.com"

[[cases]]
name = "al-shortcut-reference"
text = "日本語 [x] 日本語\n\n[x]: https://example.com"
findings = []
fixed = "日本語 [x] 日本語\n\n[x]: https://example.com"

[[cases]]
name = "al-collapsed-reference"
text = "日本語 [x][] 日本語\n\n[x]: https://example.com"
findings = []
fixed = "日本語 [x][] 日本語\n\n[x]: https://example.com"

[[cases]]
name = "al-image"
text = "日本語 ![alt](a.png) 日本語"
findings = []
fixed = "日本語 ![alt](a.png) 日本語"

[[cases]]
name = "al-image-reference"
text = "日本語 ![alt][r] 日本語\n\n[r]: a.png"
findings = []
fixed = "日本語 ![alt][r] 日本語\n\n[r]: a.png"

[[cases]]
name = "al-image-link"
text = "日本語 [![alt](a.png)](https://example.com) 日本語"
findings = ["1:4", "1:41"]
messages = ["リンクの前の空白を削除する", "リンクの後の空白を削除する"]
fixed = "日本語[![alt](a.png)](https://example.com)日本語"

[[cases]]
name = "al-title"
text = "日本語 [x](https://example.com \"タイトル\") 日本語"
findings = ["1:4", "1:36"]
messages = ["リンクの前の空白を削除する", "リンクの後の空白を削除する"]
fixed = "日本語[x](https://example.com \"タイトル\")日本語"

[[cases]]
name = "al-code-text"
text = "日本語 [`c`](https://example.com) 日本語"
findings = ["1:4", "1:31"]
messages = ["リンクの前の空白を削除する", "リンクの後の空白を削除する"]
fixed = "日本語[`c`](https://example.com)日本語"

[[cases]]
name = "al-japanese-text"
text = "日本語 [日本語](https://example.com) 日本語"
findings = ["1:4", "1:31"]
messages = ["リンクの前の空白を削除する", "リンクの後の空白を削除する"]
fixed = "日本語[日本語](https://example.com)日本語"

[[cases]]
name = "al-reference-definition-text"
text = "日本語 [x] 日本語\n\n[x]: https://example.com \"日本語\""
findings = []
fixed = "日本語 [x] 日本語\n\n[x]: https://example.com \"日本語\""
