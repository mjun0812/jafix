# yomiyasu-emoji-prohibited の例。期待値は、yomiyasu 3.4.1 の `yomiyasu_lint.py` を文書の種類を指定せずに実行した結果から作った。
# yomiyasuは指摘を行ごとに1件出す。jafixは間に何も挟まずに続く絵文字ごとに1件を出すので、列と文面はjafixの規則から決めた。
#
# builtin:  設定ファイルの [builtin] の表に書く内容
# name:     caseの名前
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面

builtin = 'yomiyasu-emoji-prohibited = true'

[[cases]]
name = "当たる-完成しました🚀"
text = "完成しました🚀"
findings = ["1:7"]
messages = ["絵文字「🚀」を使っている"]

[[cases]]
name = "当たる-✅ 完了"
text = "✅ 完了"
findings = ["1:1"]
messages = ["絵文字「✅」を使っている"]

