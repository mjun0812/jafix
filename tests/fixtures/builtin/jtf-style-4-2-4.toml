# 4.2.4.中黒(・) の例。期待値は、textlint 15.8.0 と textlint-rule-preset-jtf-style 3.0.3 の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所か、既存の修正ルールと組み合わさる箇所で、期待値は設計の規則から決めた。
#
# rule:     指摘の行の `[<rule-id>]` のID (fixtureのファイル名はIDを使えないので、ここに書く)
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を全caseに当て、caseに書けばそちらだけを使う
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘と箇所の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    修正ルールだけが持つ。`jafix fix` の後の内容から、末尾の改行を除いたもの。2回目の `jafix fix` で変わらないことも確かめる

rule = "4.2.4.中黒(・)"
builtin = '''
"4.2.4.中黒(・)" = true
no-hankaku-kana = false
'''

[[cases]]
name = "nk-katakana"
text = "サーバ\uff65クライアント"
findings = ["1:4"]
messages = ["半角の中黒「\uff65」を全角の「・」にする"]
fixed = "サーバ・クライアント"

[[cases]]
name = "nk-alphabet"
text = "a\uff65b"
findings = ["1:2"]
messages = ["半角の中黒「\uff65」を全角の「・」にする"]
fixed = "a・b"

[[cases]]
name = "nk-kanji"
text = "日本\uff65中国"
findings = ["1:3"]
messages = ["半角の中黒「\uff65」を全角の「・」にする"]
fixed = "日本・中国"

[[cases]]
name = "nk-hiragana"
text = "ひらがな\uff65ひらがな"
findings = ["1:5"]
messages = ["半角の中黒「\uff65」を全角の「・」にする"]
fixed = "ひらがな・ひらがな"

[[cases]]
name = "nk-japanese-and-english"
text = "日本語\uff65English"
findings = ["1:4"]
messages = ["半角の中黒「\uff65」を全角の「・」にする"]
fixed = "日本語・English"

[[cases]]
name = "nk-repetition-mark"
text = "人々\uff65日"
findings = ["1:3"]
messages = ["半角の中黒「\uff65」を全角の「・」にする"]
fixed = "人々・日"

[[cases]]
name = "nk-surrogate-pair-kanji"
text = "\U00020bb7\uff65野"
findings = ["1:2"]
messages = ["半角の中黒「\uff65」を全角の「・」にする"]
fixed = "\U00020bb7・野"

[[cases]]
name = "nk-digit-neighbour-is-not-checked"
text = "1\uff652"
findings = []
fixed = "1\uff652"

[[cases]]
name = "nk-halfwidth-katakana-neighbour-is-not-checked"
text = "\uff76\uff80\uff76\uff85\uff65です"
findings = []
fixed = "\uff76\uff80\uff76\uff85\uff65です"

[[cases]]
name = "nk-at-the-start"
text = "\uff65日本語"
findings = []
fixed = "\uff65日本語"

[[cases]]
name = "nk-at-the-end"
text = "日本語\uff65"
findings = []
fixed = "日本語\uff65"

[[cases]]
name = "nk-fullwidth-is-not-checked"
text = "サーバ・クライアント"
findings = []
fixed = "サーバ・クライアント"

[[cases]]
name = "nk-space-neighbour-is-not-checked"
text = "日本語 \uff65 日本語"
findings = []
fixed = "日本語 \uff65 日本語"

[[cases]]
name = "nk-two-lines"
text = "サーバ\uff65クライアント\n日本\uff65中国"
findings = ["1:4", "2:3"]
messages = ["半角の中黒「\uff65」を全角の「・」にする", "半角の中黒「\uff65」を全角の「・」にする"]
fixed = "サーバ・クライアント\n日本・中国"

[[cases]]
name = "nk-after-inline-code"
text = "`x`\uff65日本語"
findings = []
fixed = "`x`\uff65日本語"

[[cases]]
name = "nk-before-inline-code"
text = "日本語\uff65`x`"
findings = []
fixed = "日本語\uff65`x`"

[[cases]]
name = "nk-every-middle-dot"
note = "前後の文字で判定するので、すべての `\uff65` を指摘する。textlintは一致を重ねずに探すので、`ア\uff65イ\uff65ウ` の2つ目の `\uff65` を見落とし、1回の `--fix` では1つしか直らない"
text = "ア\uff65イ\uff65ウ"
findings = ["1:2", "1:4"]
messages = ["半角の中黒「\uff65」を全角の「・」にする", "半角の中黒「\uff65」を全角の「・」にする"]
fixed = "ア・イ・ウ"

[[cases]]
name = "nk-several-middle-dots-of-words"
text = "サーバ\uff65クライアント\uff65ネットワーク"
findings = ["1:4", "1:11"]
messages = ["半角の中黒「\uff65」を全角の「・」にする", "半角の中黒「\uff65」を全角の「・」にする"]
fixed = "サーバ・クライアント・ネットワーク"

[[cases]]
name = "nk-every-middle-dot-of-single-letters"
note = "すべての `\uff65` を指摘する。textlintは1文字を挟んだ `a\uff65b\uff65c\uff65d` の `b` と `c` に挟まれた `\uff65` を見落とす"
text = "a\uff65b\uff65c\uff65d"
findings = ["1:2", "1:4", "1:6"]
messages = ["半角の中黒「\uff65」を全角の「・」にする", "半角の中黒「\uff65」を全角の「・」にする", "半角の中黒「\uff65」を全角の「・」にする"]
fixed = "a・b・c・d"

[[cases]]
name = "nk-overlaps-no-hankaku-kana"
note = "`no-hankaku-kana` が有効なら、同じ範囲の箇所はルールの一覧で前にある `no-hankaku-kana` の箇所が残り、`4.2.4` の箇所は出ない。結果は同じである"
builtin = '''
"4.2.4.中黒(・)" = true
'''
text = "サーバ\uff65クライアント"
findings = []
fixed = "サーバ・クライアント"

[[cases]]
name = "nk-heading"
text = "# サーバ\uff65クライアント"
findings = []
fixed = "# サーバ\uff65クライアント"

[[cases]]
name = "nk-quote"
text = "> サーバ\uff65クライアント"
findings = []
fixed = "> サーバ\uff65クライアント"

[[cases]]
name = "nk-table"
text = "| 列 |\n| - |\n| サーバ\uff65クライアント |"
findings = []
fixed = "| 列 |\n| - |\n| サーバ\uff65クライアント |"

[[cases]]
name = "nk-list"
text = "- サーバ\uff65クライアント"
findings = ["1:6"]
messages = ["半角の中黒「\uff65」を全角の「・」にする"]
fixed = "- サーバ・クライアント"

[[cases]]
name = "nk-link"
text = "[サーバ\uff65クライアント](https://example.com)"
findings = []
fixed = "[サーバ\uff65クライアント](https://example.com)"

[[cases]]
name = "nk-strong"
text = "**サーバ\uff65クライアント**"
findings = []
fixed = "**サーバ\uff65クライアント**"

[[cases]]
name = "nk-emphasis"
text = "*サーバ\uff65クライアント*"
findings = []
fixed = "*サーバ\uff65クライアント*"

[[cases]]
name = "nk-strike"
text = "~~サーバ\uff65クライアント~~"
findings = []
fixed = "~~サーバ\uff65クライアント~~"

[[cases]]
name = "nk-code"
text = "`サーバ\uff65クライアント`"
findings = []
fixed = "`サーバ\uff65クライアント`"

[[cases]]
name = "nk-footnote"
text = "[^1]: サーバ\uff65クライアント"
findings = ["1:10"]
messages = ["半角の中黒「\uff65」を全角の「・」にする"]
fixed = "[^1]: サーバ・クライアント"

[[cases]]
name = "nk-html"
text = "<span>サーバ\uff65クライアント</span>"
findings = ["1:10"]
messages = ["半角の中黒「\uff65」を全角の「・」にする"]
fixed = "<span>サーバ・クライアント</span>"
