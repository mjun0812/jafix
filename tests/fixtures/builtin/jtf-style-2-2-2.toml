findings = ["1:1", "1:9"]
messages = ["算用数字で書く: 二十三十回", "算用数字で書く: 三回"]

[[cases]]
name = "nk-two-lines"
text = "一行目は三回\n二行目は五番目"
findings = ["1:5", "2:5"]
messages = ["算用数字で書く: 三回", "算用数字で書く: 五番目"]

[[cases]]
