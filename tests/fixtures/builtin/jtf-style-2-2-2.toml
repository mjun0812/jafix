note = "パターンごとの最初の一致だけでなく、すべての一致を指摘する。textlintは `回` と `万` のパターンで1件ずつ、2件だけを指摘する"
text = "三回と二回と一万と二万"
findings = ["1:1", "1:4", "1:7", "1:10"]
messages = ["算用数字で書く: 三回", "算用数字で書く: 二回", "算用数字で書く: 一万", "算用数字で書く: 二万"]

[[cases]]
name = "nk-ignore-overlapping-match"
note = "無視パターンは、その一致に重なる箇所に当たるときだけ、その一致を外す。`数十万` の `十万` だけを外し、2つ目の `十万` を指摘する。textlintは文字列のどこかに無視パターンが当たれば、パターンの指摘を全部やめる"
text = "数十万と十万"
findings = ["1:5"]
messages = ["算用数字で書く: 十万"]

[[cases]]
name = "nk-ignore-tada-hitotsu"
note = "`ただ一つ` の `一つ` だけを外し、`三つ` を指摘する。textlintは無視パターンが文字列のどこかに当たるので、`三つ` も指摘しない"
text = "ただ一つ、三つ"
findings = ["1:6"]
messages = ["算用数字で書く: 三つ"]

[[cases]]
name = "nk-ignore-hitotsu-henji"
