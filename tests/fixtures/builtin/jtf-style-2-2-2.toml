# 2.2.2.算用数字と漢数字の使い分け の例。期待値は、textlint 15.8.0 と textlint-rule-preset-jtf-style 3.0.3 の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所か、既存の修正ルールと組み合わさる箇所で、期待値は設計の規則から決めた。
#
# rule:     指摘の行の `[<rule-id>]` のID (fixtureのファイル名はIDを使えないので、ここに書く)
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を全caseに当て、caseに書けばそちらだけを使う
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘と箇所の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    修正ルールだけが持つ。`jafix fix` の後の内容から、末尾の改行を除いたもの。2回目の `jafix fix` で変わらないことも確かめる

rule = "2.2.2.算用数字と漢数字の使い分け"
builtin = '''
"2.2.2.算用数字と漢数字の使い分け" = true
'''

[[cases]]
name = "nk-basic"
text = "三回と三つと十億"
findings = ["1:1", "1:4", "1:7"]
messages = ["算用数字で書く: 三回", "算用数字で書く: 三つ", "算用数字で書く: 十億"]

[[cases]]
name = "nk-large-units"
note = "パターンごとの最初の一致だけでなく、すべての一致を指摘する。textlintは `K[兆億万]` のパターンで最初の `一万` だけを指摘する"
text = "一万と二兆と三億"
findings = ["1:1", "1:4", "1:7"]
messages = ["算用数字で書く: 一万", "算用数字で書く: 二兆", "算用数字で書く: 三億"]

[[cases]]
name = "nk-counters"
text = "三か月、五番目、二進法、四次元"
findings = ["1:1", "1:5", "1:9", "1:13"]
messages = ["算用数字で書く: 三か月", "算用数字で書く: 五番目", "算用数字で書く: 二進法", "算用数字で書く: 四次元"]

[[cases]]
name = "nk-chapters"
text = "第三章と第五節"
findings = ["1:1", "1:5"]
messages = ["算用数字で書く: 第三章", "算用数字で書く: 第五節"]

[[cases]]
name = "nk-kanji-number-chars"
note = "パターンごとの最初の一致だけでなく、すべての一致を指摘する。textlintは `K回` のパターンで最初の `十一回` だけを指摘する"
text = "十一回、百二十回、壱回、〇回、拾回"
findings = ["1:1", "1:5", "1:10", "1:13", "1:16"]
messages = ["算用数字で書く: 十一回", "算用数字で書く: 百二十回", "算用数字で書く: 壱回", "算用数字で書く: 〇回", "算用数字で書く: 拾回"]

[[cases]]
name = "nk-to-kanji"
text = "世界1、1時的、1部分、第3者"
findings = ["1:1", "1:5", "1:9", "1:13"]
messages = ["漢数字で書く: 世界1", "漢数字で書く: 1時的", "漢数字で書く: 1部分", "漢数字で書く: 第3者"]

[[cases]]
name = "nk-to-kanji-b"
text = "と1種、1部の話、1番に、3次関数、5大陸"
findings = ["1:1", "1:5", "1:10", "1:14", "1:19"]
messages = ["漢数字で書く: と1種", "漢数字で書く: 1部の", "漢数字で書く: 1番に", "漢数字で書く: 3次関数", "漢数字で書く: 5大陸"]

[[cases]]
name = "nk-to-kanji-sho"
note = "パターンごとの最初の一致だけでなく、すべての一致を指摘する。textlintは `数10+[兆億万]` のパターンで最初の `数100万` だけを指摘し、`数10兆` は指摘しない"
text = "数10倍、数100万、数10年、数10兆"
findings = ["1:1", "1:6", "1:12", "1:17"]
messages = ["漢数字で書く: 数10倍", "漢数字で書く: 数100万", "漢数字で書く: 数10年", "漢数字で書く: 数10兆"]

