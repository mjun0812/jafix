text = "何百万と百万"
findings = ["1:5"]
messages = ["算用数字で書く: 百万"]

[[cases]]
name = "nk-ignore-other-ignore-patterns"
note = "無視パターンに重なる `一つ` `二つ` だけを外し、`三つ` を指摘する。textlintは `三つ` も指摘しない"
text = "唯一つと馬鹿の二つと瓜二つと三つ"
findings = ["1:15"]
messages = ["算用数字で書く: 三つ"]

[[cases]]
name = "nk-ignore-in-another-line"
note = "無視パターンが別の行に当たっても、その一致に重ならなければ外さない。textlintは同じ文字列の別の行の無視パターンで、2行目の `三つ` も指摘しない"
text = "三つ子\n三つ"
findings = ["2:1"]
messages = ["算用数字で書く: 三つ"]

[[cases]]
name = "nk-ignore-in-another-paragraph"
text = "三つ子\n\n三つ"
findings = ["3:1"]
messages = ["算用数字で書く: 三つ"]

[[cases]]
name = "nk-invalid-kanji-sequence"
note = "不正な漢数字の並びでも止まらず、指摘する。textlintは例外で検査全体が止まる"
text = "十十回です"
findings = ["1:1"]
messages = ["算用数字で書く: 十十回"]

[[cases]]
name = "nk-invalid-kanji-sequence-b"
note = "不正な漢数字の並びでも止まらず、指摘する。textlintは例外で検査全体が止まる"
