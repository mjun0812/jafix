# date-weekday-mismatch の例。期待値は、textlint 15.8.0 と textlint-rule-date-weekday-mismatch 1.1.1 (chrono-node 1.4.9、moment 2.31.0) の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所で、期待値は設計の規則から決めた。
# textlintは曜日の言語を日付を読んだparserで決める。jafixは括弧の中身で決めるので、年が先の数字の日付と日本語の曜日の組も確かめる。
# 年を補うcaseと `今年`・`本年` のcaseは、実行する年によらないように currentYear を書く。
#
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭の builtin は全caseに当たり、caseに builtin があればその代わりに使う
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)

builtin = 'date-weekday-mismatch = true'

[[cases]]
name = "ja-basic"
text = "2024年4月23日(月)"
findings = ["1:12"]
messages = ["「2024年4月23日(」の曜日は「火」で、「月」ではない"]

[[cases]]
name = "ja-correct"
text = "2024年4月23日(火)"
findings = []

[[cases]]
name = "ja-fullwidth-paren"
text = "2024年04月23日（月）"
findings = ["1:13"]
messages = ["「2024年04月23日（」の曜日は「火」で、「月」ではない"]

[[cases]]
name = "ja-mixed-paren"
text = "2024年4月23日（月)と2024年4月23日(月）"
findings = ["1:12", "1:26"]
messages = ["「2024年4月23日（」の曜日は「火」で、「月」ではない", "「2024年4月23日(」の曜日は「火」で、「月」ではない"]

[[cases]]
name = "ja-space-in-date"
text = "2024年 4月 23日(月)"
findings = ["1:14"]
messages = ["「2024年 4月 23日(」の曜日は「火」で、「月」ではない"]

[[cases]]
name = "ja-space-before-paren"
text = "2024年4月23日 (月)"
findings = ["1:13"]
messages = ["「2024年4月23日 (」の曜日は「火」で、「月」ではない"]

[[cases]]
name = "ja-fullwidth-space-before-paren"
text = "2024年4月23日\u3000(月)"
findings = ["1:13"]
messages = ["「2024年4月23日\u3000(」の曜日は「火」で、「月」ではない"]

[[cases]]
name = "ja-space-inside-paren"
note = "指摘の範囲は括弧の中の前後の空白を除いた曜日である。textlintは括弧の中の前の空白を置き換えの始まりにし、指摘をそこに出す"
text = "2024年4月23日( 月 )"
findings = ["1:13"]
messages = ["「2024年4月23日(」の曜日は「火」で、「月」ではない"]

[[cases]]
name = "ja-fullwidth-digits"
text = "２０２４年４月２３日（月）"
findings = ["1:12"]
messages = ["「２０２４年４月２３日（」の曜日は「火」で、「月」ではない"]

[[cases]]
name = "ja-reiwa"
