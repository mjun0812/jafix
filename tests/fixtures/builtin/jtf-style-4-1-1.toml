# 4.1.1.句点(。) の例。期待値は、textlint 15.8.0 と textlint-rule-preset-jtf-style 3.0.3 の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所か、既存の修正ルールと組み合わさる箇所で、期待値は設計の規則から決めた。
#
# rule:     指摘の行の `[<rule-id>]` のID (fixtureのファイル名はIDを使えないので、ここに書く)
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を全caseに当て、caseに書けばそちらだけを使う
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘と箇所の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    修正ルールだけが持つ。`jafix fix` の後の内容から、末尾の改行を除いたもの。2回目の `jafix fix` で変わらないことも確かめる

rule = "4.1.1.句点(。)"
builtin = '''
"4.1.1.句点(。)" = true
'''

[[cases]]
name = "mp-corner-bracket"
text = "「これは。」と言う"
findings = ["1:5"]
messages = ["閉じ括弧の前に「。」を付けない"]

[[cases]]
name = "mp-fullwidth-paren"
text = "（これは。）と言う"
findings = ["1:5"]
messages = ["閉じ括弧の前に「。」を付けない"]

[[cases]]
name = "mp-halfwidth-paren"
text = "(これは。)と言う"
findings = ["1:5"]
messages = ["閉じ括弧の前に「。」を付けない"]

[[cases]]
name = "mp-no-period"
text = "「これは」と言う"
findings = []

[[cases]]
name = "mp-period-after-bracket"
text = "「これは」。と言う"
findings = []

[[cases]]
name = "mp-double-corner-bracket-is-not-checked"
text = "『これは。』と言う"
findings = []

[[cases]]
name = "mp-square-bracket-is-not-checked"
text = "［これは。］と［これは。]"
findings = []

[[cases]]
name = "mp-period-inside-and-after"
text = "「これは。」。"
findings = ["1:5"]
messages = ["閉じ括弧の前に「。」を付けない"]

[[cases]]
name = "mp-several"
text = "「あ。」と「い。」と（う。）"
findings = ["1:3", "1:8", "1:13"]
messages = ["閉じ括弧の前に「。」を付けない", "閉じ括弧の前に「。」を付けない", "閉じ括弧の前に「。」を付けない"]

[[cases]]
name = "mp-two-periods"
text = "「これは。。」"
findings = ["1:6"]
messages = ["閉じ括弧の前に「。」を付けない"]

[[cases]]
name = "mp-period-then-space"
text = "「これは。 」"
findings = []

[[cases]]
name = "mp-halfwidth-period-is-not-checked"
text = "「これは.」"
findings = []

[[cases]]
name = "mp-closing-bracket-without-opening"
text = "これは。」"
findings = ["1:4"]
messages = ["閉じ括弧の前に「。」を付けない"]

[[cases]]
name = "mp-two-lines"
text = "「あ。」\n（い。）"
findings = ["1:3", "2:3"]
messages = ["閉じ括弧の前に「。」を付けない", "閉じ括弧の前に「。」を付けない"]

[[cases]]
name = "mp-surrogate-pair-before"
text = "\U00020bb7野家は「これは。」と言う"
findings = ["1:9"]
messages = ["閉じ括弧の前に「。」を付けない"]

[[cases]]
name = "mp-before-inline-code"
text = "「これは。`x`」"
findings = []

[[cases]]
name = "mp-after-inline-code"
text = "「`x`。」"
findings = ["1:5"]
messages = ["閉じ括弧の前に「。」を付けない"]

[[cases]]
name = "mp-across-strong"
text = "**「これは**。」"
findings = ["1:9"]
messages = ["閉じ括弧の前に「。」を付けない"]

[[cases]]
name = "mp-heading"
text = "# 「これは。」と言う"
findings = []

[[cases]]
name = "mp-quote"
text = "> 「これは。」と言う"
findings = []

[[cases]]
name = "mp-table"
text = "| 列 |\n| - |\n| 「これは。」と言う |"
findings = []

[[cases]]
name = "mp-list"
text = "- 「これは。」と言う"
findings = ["1:7"]
messages = ["閉じ括弧の前に「。」を付けない"]

[[cases]]
name = "mp-link"
text = "[「これは。」と言う](https://example.com)"
findings = []

[[cases]]
name = "mp-strong"
text = "**「これは。」と言う**"
findings = []

[[cases]]
name = "mp-emphasis"
text = "*「これは。」と言う*"
findings = []

[[cases]]
name = "mp-strike"
text = "~~「これは。」と言う~~"
findings = []

[[cases]]
name = "mp-code"
text = "`「これは。」と言う`"
findings = []

[[cases]]
name = "mp-footnote"
text = "[^1]: 「これは。」と言う"
findings = ["1:11"]
messages = ["閉じ括弧の前に「。」を付けない"]

[[cases]]
name = "mp-html"
text = "<span>「これは。」と言う</span>"
findings = ["1:11"]
messages = ["閉じ括弧の前に「。」を付けない"]
