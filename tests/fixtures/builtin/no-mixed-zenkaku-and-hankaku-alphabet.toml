findings = ["1:2", "1:9"]
messages = ["全角のアルファベット「ＡＢＣ」を半角にする", "全角のアルファベット「ａ」を半角にする"]
fixed = "\U00020bb7ABC と \U00020bb7a"

[[cases]]
name = "nm-japanese-neighbors"
