# no-mixed-zenkaku-and-hankaku-alphabet の例。期待値は、textlint 15.8.0 と textlint-rule-no-mixed-zenkaku-and-hankaku-alphabet 1.0.1 の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所か、既存の修正ルールと組み合わさる箇所で、期待値は設計の規則から決めた。
#
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を全caseに当て、caseに書けばそちらだけを使う
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘と箇所の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    修正ルールだけが持つ。`jafix fix` の後の内容から、末尾の改行を除いたもの。2回目の `jafix fix` で変わらないことも確かめる

builtin = '''
no-mixed-zenkaku-and-hankaku-alphabet = true
space-between-ja-and-alnum = false
space-between-ja-and-paren = false
fullwidth-paren = false
'''

[[cases]]
name = "nm-basic"
text = "ＡＢＣは全角 ａｂｃ１２３"
findings = ["1:1", "1:8"]
messages = ["全角のアルファベット「ＡＢＣ」を半角にする", "全角のアルファベット「ａｂｃ」を半角にする"]
fixed = "ABCは全角 abc１２３"

[[cases]]
name = "nm-explicit-halfwidth"
builtin = '''
no-mixed-zenkaku-and-hankaku-alphabet = { prefer = '半角' }
space-between-ja-and-alnum = false
space-between-ja-and-paren = false
fullwidth-paren = false
'''
text = "ＡＢＣは全角 ａｂｃ"
findings = ["1:1", "1:8"]
messages = ["全角のアルファベット「ＡＢＣ」を半角にする", "全角のアルファベット「ａｂｃ」を半角にする"]
fixed = "ABCは全角 abc"

[[cases]]
name = "nm-mixed-case-run"
text = "ＡｂＣ と ａＢｃ"
findings = ["1:1", "1:7"]
messages = ["全角のアルファベット「ＡｂＣ」を半角にする", "全角のアルファベット「ａＢｃ」を半角にする"]
fixed = "AbC と aBc"

[[cases]]
name = "nm-halfwidth-only"
text = "ABC abc と 123"
findings = []
fixed = "ABC abc と 123"

[[cases]]
name = "nm-digits-and-symbols"
text = "１２３ ＆ ＠ ！ ＋"
findings = []
fixed = "１２３ ＆ ＠ ！ ＋"

[[cases]]
name = "nm-run-boundaries"
text = "ＡＢＣ，ＤＥＦ\u3000ＧＨＩ"
findings = ["1:1", "1:5", "1:9"]
messages = ["全角のアルファベット「ＡＢＣ」を半角にする", "全角のアルファベット「ＤＥＦ」を半角にする", "全角のアルファベット「ＧＨＩ」を半角にする"]
fixed = "ABC，DEF\u3000GHI"

[[cases]]
name = "nm-adjacent-halfwidth"
text = "ＡＢＣabcＤＥＦ"
findings = ["1:1", "1:7"]
messages = ["全角のアルファベット「ＡＢＣ」を半角にする", "全角のアルファベット「ＤＥＦ」を半角にする"]
fixed = "ABCabcDEF"

[[cases]]
name = "nm-surrogate-before"
