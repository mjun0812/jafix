# ja-space-around-code の例。期待値は、textlint 15.8.0 と textlint-rule-ja-space-around-code 3.0.4 (textlint-rule-preset-ja-spacing 3.0.4) の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所か、既存の修正ルールと組み合わさる箇所で、期待値は設計の規則から決めた。
#
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を全caseに当て、caseに書けばそちらだけを使う
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘と箇所の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    修正ルールだけが持つ。`jafix fix` の後の内容から、末尾の改行を除いたもの。2回目の `jafix fix` で変わらないことも確かめる

builtin = '''
ja-space-around-code = true
space-between-ja-and-alnum = false
space-between-ja-and-paren = false
fullwidth-paren = false
'''

[[cases]]
name = "ac-basic"
text = "日本語 `c` 日本語"
findings = ["1:4", "1:8"]
messages = ["インラインコードの前の空白を削除する", "インラインコードの後の空白を削除する"]
fixed = "日本語`c`日本語"

[[cases]]
name = "ac-before-only"
text = "日本語 `c`日本語"
findings = ["1:4"]
messages = ["インラインコードの前の空白を削除する"]
fixed = "日本語`c`日本語"

[[cases]]
name = "ac-after-only"
note = "`after = false` の箇所の位置は、消す空白である。textlintは指摘を空白の次の文字に出す (修正の範囲は空白)"
text = "日本語`c` 日本語"
findings = ["1:7"]
messages = ["インラインコードの後の空白を削除する"]
fixed = "日本語`c`日本語"

[[cases]]
name = "ac-no-space"
text = "日本語`c`日本語"
findings = []
fixed = "日本語`c`日本語"

[[cases]]
name = "ac-fullwidth-space"
text = "日本語\u3000`c`\u3000日本語"
findings = []
fixed = "日本語\u3000`c`\u3000日本語"

[[cases]]
name = "ac-two-spaces"
