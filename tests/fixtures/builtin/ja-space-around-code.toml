note = "文字で日本語かを判定し、U+20000からU+2FFFFの漢字も日本語の文字に数える。textlintはUTF-16の1単位で判定するので、サロゲートペアの漢字の隣を見落とす"
text = "\U00020bb7 `c` \U00020bb7"
findings = ["1:2", "1:6"]
messages = ["インラインコードの前の空白を削除する", "インラインコードの後の空白を削除する"]
fixed = "\U00020bb7`c`\U00020bb7"

