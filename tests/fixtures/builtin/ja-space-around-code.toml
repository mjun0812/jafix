name = "ac-range-edges"
text = "ぁ `c`\nん `c`\nゔ `c`\nァ `c`\nヶ `c`\nヷ `c`\n㐀 `c`\n䶿 `c`\n䷀ `c`\n豈 `c`\n﫿 `c`"
findings = ["1:2", "2:2", "4:2", "5:2", "7:2", "8:2", "10:2", "11:2"]
messages = ["インラインコードの前の空白を削除する", "インラインコードの前の空白を削除する", "インラインコードの前の空白を削除する", "インラインコードの前の空白を削除する", "インラインコードの前の空白を削除する", "インラインコードの前の空白を削除する", "インラインコードの前の空白を削除する", "インラインコードの前の空白を削除する"]
fixed = "ぁ`c`\nん`c`\nゔ `c`\nァ`c`\nヶ`c`\nヷ `c`\n㐀`c`\n䶿`c`\n䷀ `c`\n豈`c`\n﫿`c`"

