text = "English `c` 日本語 と 日本語 `c` English"
findings = ["1:12", "1:22"]
messages = ["インラインコードの後の空白を削除する", "インラインコードの前の空白を削除する"]
fixed = "English `c`日本語 と 日本語`c` English"

[[cases]]
