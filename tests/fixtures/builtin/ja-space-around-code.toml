text = "ー `c` ー と 々 `c` 々 と 。 `c` 、 と 〇 `c` 〇 と ・ `c` ・"
findings = []
fixed = "ー `c` ー と 々 `c` 々 と 。 `c` 、 と 〇 `c` 〇 と ・ `c` ・"

