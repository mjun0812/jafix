# 4.3.1.丸かっこ（） の例。期待値は、textlint 15.8.0 と textlint-rule-preset-jtf-style 3.0.3 の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所か、既存の修正ルールと組み合わさる箇所で、期待値は設計の規則から決めた。
#
# rule:     指摘の行の `[<rule-id>]` のID (fixtureのファイル名はIDを使えないので、ここに書く)
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を全caseに当て、caseに書けばそちらだけを使う
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘と箇所の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    修正ルールだけが持つ。`jafix fix` の後の内容から、末尾の改行を除いたもの。2回目の `jafix fix` で変わらないことも確かめる

rule = "4.3.1.丸かっこ（）"
builtin = '''
"4.3.1.丸かっこ（）" = true
fullwidth-paren = false
'''

[[cases]]
name = "pr-japanese-both-sides"
text = "日本語(補足)です"
findings = ["1:4", "1:7"]
messages = ["半角の丸括弧「(」を全角の「（」にする", "半角の丸括弧「)」を全角の「）」にする"]

[[cases]]
name = "pr-in-sentence"
text = "これは(例)です"
findings = ["1:4", "1:6"]
messages = ["半角の丸括弧「(」を全角の「（」にする", "半角の丸括弧「)」を全角の「）」にする"]

[[cases]]
name = "pr-at-the-start"
text = "(例)から始まる"
findings = ["1:1", "1:3"]
messages = ["半角の丸括弧「(」を全角の「（」にする", "半角の丸括弧「)」を全角の「）」にする"]

[[cases]]
name = "pr-at-the-end"
text = "終わりは(例)"
findings = ["1:5", "1:7"]
messages = ["半角の丸括弧「(」を全角の「（」にする", "半角の丸括弧「)」を全角の「）」にする"]

[[cases]]
name = "pr-opening-at-the-start-only"
text = "(日本語"
findings = ["1:1"]
messages = ["半角の丸括弧「(」を全角の「（」にする"]

[[cases]]
name = "pr-closing-at-the-end-only"
text = "日本語)"
findings = ["1:4"]
messages = ["半角の丸括弧「)」を全角の「）」にする"]

[[cases]]
name = "pr-opening-at-the-start-english"
text = "(abc 日本語"
findings = []

[[cases]]
name = "pr-japanese-between-parens-with-english-outside"
text = "English (日本語) text"
findings = ["1:9", "1:13"]
messages = ["半角の丸括弧「(」を全角の「（」にする", "半角の丸括弧「)」を全角の「）」にする"]

[[cases]]
name = "pr-english-inside-with-spaces"
text = "日本語 (English) です"
findings = []

[[cases]]
name = "pr-english-only"
text = "Use the API (see docs) here."
findings = []

[[cases]]
name = "pr-function-call"
text = "foo(bar) is a function."
findings = []

[[cases]]
name = "pr-function-call-between-japanese"
text = "関数foo(bar)を呼ぶ"
findings = []

[[cases]]
name = "pr-fullwidth-is-allowed"
text = "全角（補足）です"
findings = []

[[cases]]
name = "pr-japanese-parenthesis-with-space-inside"
text = "日本語( 補足 )です"
findings = ["1:4", "1:9"]
messages = ["半角の丸括弧「(」を全角の「（」にする", "半角の丸括弧「)」を全角の「）」にする"]

[[cases]]
name = "pr-no-japanese-between"
text = "日本語(a)(b)"
findings = []

[[cases]]
name = "pr-japanese-only-before"
text = "日本語(abc)"
findings = []

[[cases]]
name = "pr-japanese-only-after"
text = "(abc)日本語"
findings = []

[[cases]]
name = "pr-long-vowel-is-not-japanese"
text = "サーバー(補足)です"
findings = ["1:5", "1:8"]
messages = ["半角の丸括弧「(」を全角の「（」にする", "半角の丸括弧「)」を全角の「）」にする"]

[[cases]]
name = "pr-surrogate-pair-kanji"
text = "\U00020bb7(日)\U00020bb7"
findings = ["1:2", "1:4"]
messages = ["半角の丸括弧「(」を全角の「（」にする", "半角の丸括弧「)」を全角の「）」にする"]

[[cases]]
name = "pr-two-lines"
text = "日本語(補足)です\nこれは(例)です"
findings = ["1:4", "1:7", "2:4", "2:6"]
messages = ["半角の丸括弧「(」を全角の「（」にする", "半角の丸括弧「)」を全角の「）」にする", "半角の丸括弧「(」を全角の「（」にする", "半角の丸括弧「)」を全角の「）」にする"]

[[cases]]
name = "pr-position-of-the-captured-closing-paren"
note = "位置は、正規表現が捕捉した括弧の位置である。最初の括弧と、日本語を挟んだ最後の括弧になる。textlintは捕捉した文字列を一致の先頭から `indexOf` で探すので、`foo()` の `)` を指す"
text = "関数 foo() と bar() を呼ぶ"
findings = ["1:7", "1:16"]
messages = ["半角の丸括弧「(」を全角の「（」にする", "半角の丸括弧「)」を全角の「）」にする"]

[[cases]]
name = "pr-position-of-the-captured-closing-paren-b"
note = "位置は、正規表現が捕捉した括弧の位置である。最初の `(` と最後の `)` になる。textlintは `)` を `foo(bar)` の `)` と報告する"
text = "foo(bar) と baz(qux) です"
findings = ["1:4", "1:19"]
messages = ["半角の丸括弧「(」を全角の「（」にする", "半角の丸括弧「)」を全角の「）」にする"]

[[cases]]
name = "pr-position-of-the-captured-closing-paren-c"
note = "位置は、正規表現が捕捉した括弧の位置である。textlintは `)` を最初の `)` と報告する"
text = "関数foo(a, b)と関数bar(c)"
findings = ["1:6", "1:20"]
messages = ["半角の丸括弧「(」を全角の「（」にする", "半角の丸括弧「)」を全角の「）」にする"]

[[cases]]
name = "pr-every-paren-between-japanese"
note = "前後がどちらも日本語の括弧は、一致を重ねずに探すことによる見落としを写さず、すべての括弧を指摘する。1つ目の条件の最初の `(` と最後の `)` も指摘する。textlintは `日(日)日` の `日` を次の一致に使えず、1:8を見落とす。1つ目の条件で捕捉した最後の `)` を1:4と誤って報告し、1:12は出さない"
text = "日(日)日(日)日(日)日"
findings = ["1:2", "1:4", "1:6", "1:8", "1:10", "1:12"]
messages = ["半角の丸括弧「(」を全角の「（」にする", "半角の丸括弧「)」を全角の「）」にする", "半角の丸括弧「(」を全角の「（」にする", "半角の丸括弧「)」を全角の「）」にする", "半角の丸括弧「(」を全角の「（」にする", "半角の丸括弧「)」を全角の「）」にする"]

[[cases]]
name = "pr-paren-between-japanese-and-parens"
note = "括弧ごとに1件を指摘する。1つ目の条件の最初の `(` と最後の `)` と、2つ目の条件の日本語に挟まれた括弧である。`)(` の間の括弧は、日本語に挟まれていないので指摘しない。textlintは1つ目の条件の最後の `)` を、最初の `)` の位置に報告する"
text = "日(日)(日)日"
findings = ["1:2", "1:7"]
messages = ["半角の丸括弧「(」を全角の「（」にする", "半角の丸括弧「)」を全角の「）」にする"]

[[cases]]
name = "pr-longest-match-spans-english-parens"
note = "1つ目の条件は最長に当たるので、最初の `(` と最後の `)` を指摘する。間に日本語があれば、`(b)` の `)` と `(c)` の `(` は指摘しない。textlintは最後の `)` を最初の `)` の位置に報告する"
text = "a (b) 日本語 (c) d"
findings = ["1:3", "1:13"]
messages = ["半角の丸括弧「(」を全角の「（」にする", "半角の丸括弧「)」を全角の「）」にする"]

[[cases]]
name = "pr-regex-does-not-cross-lines"
text = "(foo\n日本語)"
findings = ["2:4"]
messages = ["半角の丸括弧「)」を全角の「）」にする"]

[[cases]]
name = "pr-opening-on-second-line-is-not-start"
text = "abc\n(日本語"
findings = []

[[cases]]
name = "pr-regex-does-not-cross-lines-b"
text = "日本語(補足\nです)"
findings = ["1:4", "2:3"]
messages = ["半角の丸括弧「(」を全角の「（」にする", "半角の丸括弧「)」を全角の「）」にする"]

[[cases]]
name = "pr-several-matches-after-the-first"
note = "最初の一致の後ろから、残りの括弧を同じ規則で探す。`日本語(a)(b)と日本語(c)` は最初の `(` から最後の `)` までが1つの一致になる。textlintは最後の `)` を最初の `)` の位置に報告する"
text = "日本語(a)(b)と日本語(c)"
findings = ["1:4", "1:16"]
messages = ["半角の丸括弧「(」を全角の「（」にする", "半角の丸括弧「)」を全角の「）」にする"]

[[cases]]
name = "pr-same-paren-reported-once"
text = "日本語(日本語)日本語"
findings = ["1:4", "1:8"]
messages = ["半角の丸括弧「(」を全角の「（」にする", "半角の丸括弧「)」を全角の「）」にする"]

[[cases]]
name = "pr-heading"
text = "# 日本語(補足)です"
findings = []

[[cases]]
name = "pr-quote"
text = "> 日本語(補足)です"
findings = []

[[cases]]
