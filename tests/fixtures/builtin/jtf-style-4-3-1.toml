[[cases]]
name = "pr-html"
text = "<span>日本語(補足)です</span>"
findings = ["1:10", "1:13"]
messages = ["半角の丸括弧「(」を全角の「（」にする", "半角の丸括弧「)」を全角の「）」にする"]
