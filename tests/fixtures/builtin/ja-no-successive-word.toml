# ja-no-successive-word の例。期待値は、textlint 15.8.0 と textlint-rule-preset-ja-technical-writing 12.0.2 の実行結果のうち、
# kuromojinとlinderaのトークンが同じ入力のものから作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所で、期待値はjafixの規則から決めた。
#
# name:     caseの名前
# builtin:  設定ファイルの [builtin] の表に書く内容 (省略可)
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)

[[cases]]
name = "succ-joshi"
text = "これはは問題です。"
findings = ["1:4"]
messages = ["「は」が2回続いている"]

[[cases]]
name = "succ-noun"
text = "使用使用する。"
findings = ["1:3"]
messages = ["「使用」が2回続いている"]

[[cases]]
name = "succ-three"
text = "私ののの本です。"
findings = ["1:3", "1:4"]
messages = ["「の」が2回続いている", "「の」が2回続いている"]

[[cases]]
name = "succ-touten"
text = "あ、、い。"
findings = ["1:3"]

[[cases]]
name = "succ-hiragana"
text = "ええええ、そう。"
findings = ["1:3"]

[[cases]]
name = "succ-vu"
text = "ヴァイヴァイ。"
findings = ["1:4"]

[[cases]]
name = "succ-number"
text = "値は九九です。"
findings = []

[[cases]]
name = "succ-number-one"
text = "値は一一です。"
findings = []

[[cases]]
name = "succ-onomatopee"
text = "カクカク。"
findings = []

[[cases]]
name = "succ-katakana"
text = "テストテスト。"
findings = []

[[cases]]
name = "succ-one-token"
text = "ドキドキする。"
findings = []

[[cases]]
name = "succ-spaces"
text = "あ  い"
findings = []

[[cases]]
name = "succ-tabs"
note = "kuromojiは続くタブを1つのトークンにし、linderaは1文字ずつのトークンにするが、jafixは空白のトークンの連続を指摘しないので、textlintと同じく指摘しない"
text = "あ\t\tい"
findings = []

[[cases]]
name = "succ-onomatopee-off"
builtin = 'ja-no-successive-word = { allowOnomatopee = false }'
text = "カクカク。"
findings = ["1:3"]

[[cases]]
name = "succ-onomatopee-off-katakana"
builtin = 'ja-no-successive-word = { allowOnomatopee = false }'
text = "テストテスト。"
findings = ["1:4"]

[[cases]]
name = "succ-allow-string"
builtin = 'ja-no-successive-word = { allow = ["は"] }'
text = "これはは問題です。ののだ。"
findings = ["1:11"]

[[cases]]
name = "succ-allow-substring"
builtin = 'ja-no-successive-word = { allow = ["使"] }'
text = "使用使用する。"
findings = []

[[cases]]
name = "succ-allow-regex"
builtin = 'ja-no-successive-word = { allow = ["/^は$/"] }'
text = "これはは問題です。ののだ。"
findings = ["1:11"]

[[cases]]
name = "succ-allow-regex-alt"
builtin = 'ja-no-successive-word = { allow = ["/^(は|の)$/"] }'
text = "これはは問題です。ののだ。本をを読む。"
findings = ["1:16"]

[[cases]]
name = "succ-allow-miss"
builtin = 'ja-no-successive-word = { allow = ["の"] }'
text = "これはは問題です。"
findings = ["1:4"]

[[cases]]
name = "succ-heading"
text = "# これはは問題です。"
findings = ["1:6"]

[[cases]]
name = "succ-list"
text = "- これはは問題です。"
findings = ["1:6"]

[[cases]]
name = "succ-quote"
text = "> これはは問題です。"
findings = ["1:6"]

[[cases]]
name = "succ-table"
text = "| a |\n| - |\n| これはは問題です。 |"
findings = ["3:6"]

[[cases]]
name = "succ-emphasis"
text = "*これはは問題です*。"
findings = ["1:5"]

[[cases]]
name = "succ-strong"
text = "**これはは問題です**。"
findings = ["1:6"]

[[cases]]
name = "succ-link"
text = "[これはは問題です](https://example.com)。"
findings = ["1:5"]

[[cases]]
name = "succ-footnote"
text = "本文[^1]。\n\n[^1]: これはは問題です。"
findings = ["3:10"]

[[cases]]
name = "succ-multiline"
text = "あ。\nこれはは問題です。"
findings = ["2:4"]

[[cases]]
name = "succ-quote-continuation"
text = "> あ\n> これはは問題です。"
findings = ["2:6"]

[[cases]]
name = "succ-list-continuation"
text = "- これは\n  は問題です。"
findings = []

[[cases]]
name = "succ-across-strong"
text = "これは**は**問題です。"
findings = []

[[cases]]
name = "succ-soft-break"
text = "これは\nは問題です。"
findings = []

[[cases]]
name = "succ-code"
text = "`これはは問題です`。"
findings = []

[[cases]]
name = "succ-surrogate"
note = "textlintは前のサロゲートペアの文字の分だけ1文字前の1つ目の「は」を指すが、jafixは2つ目の「は」を指す"
text = "\U00020bb7これはは問題です。"
findings = ["1:5"]

[[cases]]
name = "succ-surrogate-run"
note = "textlintは続くサロゲートペアの文字の後ろの「はは」を読み飛ばして指摘しないが、linderaは2つの「は」を残すので当たる"
text = "\U00020bb7\U00020bb7はは問題です。"
findings = ["1:4"]

[[cases]]
name = "succ-autolink"
note = "textlintは自動リンクの文字列をStrとして見るが、jafixでは本文の範囲に入らない"
text = "<https://example.com/のの>"
findings = []
