# common-misspellings の例。期待値は、textlint 15.8.0 と textlint-rule-common-misspellings 1.0.1 (misspellings 1.1.0) の実行結果から作った。
# jafixの誤綴りの一覧は、Wikipediaの「Lists of common misspellings/For machines」の revision 1199637275 から作る。
# textlintの一覧 (misspellings 1.1.0 の lc-dictionary.json) と値が同じ項目のcaseは、textlintの結果と比べた。
# note のあるcaseは、片方の一覧にだけある項目か値の違う項目、jafixがtextlintと意図して変えている箇所、Markdownの解析の違いが出る箇所で、
# 期待値は設計の規則から決めた。文面の正しい語は、一致の大文字を写したものである。
#
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を、builtin を持たない全caseに当てる
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)

builtin = 'common-misspellings = true'

[[cases]]
name = "m-basic"
text = "I saw teh cat."
findings = ["1:7"]
messages = ["よくある綴りの誤り「teh」を使っている。正しくは「the」"]

[[cases]]
name = "m-correct"
text = "I saw the cat."
findings = []

[[cases]]
name = "m-title-case"
text = "Teh cat is here."
findings = ["1:1"]
messages = ["よくある綴りの誤り「Teh」を使っている。正しくは「The」"]

[[cases]]
name = "m-upper"
text = "TEH CAT is here."
findings = ["1:1"]
messages = ["よくある綴りの誤り「TEH」を使っている。正しくは「THE」"]

[[cases]]
name = "m-mixed-case"
text = "I saw tEh cat."
findings = ["1:7"]
messages = ["よくある綴りの誤り「tEh」を使っている。正しくは「tHe」"]

[[cases]]
name = "m-two-in-text"
text = "We recieve and seperate them."
findings = ["1:4", "1:16"]
messages = ["よくある綴りの誤り「recieve」を使っている。正しくは「receive」", "よくある綴りの誤り「seperate」を使っている。正しくは「separate」"]

[[cases]]
name = "m-two-lines"
text = "We recieve\nand seperate them."
findings = ["1:4", "2:5"]
messages = ["よくある綴りの誤り「recieve」を使っている。正しくは「receive」", "よくある綴りの誤り「seperate」を使っている。正しくは「separate」"]

[[cases]]
name = "m-two-corrects"
text = "Use the wich here."
findings = ["1:9"]
messages = ["よくある綴りの誤り「wich」を使っている。正しくは「which」か「witch」"]

[[cases]]
name = "m-two-corrects-space"
text = "I have alot of time."
findings = ["1:8"]
messages = ["よくある綴りの誤り「alot」を使っている。正しくは「a lot」か「allot」"]

[[cases]]
name = "m-two-corrects-upper"
text = "I HAVE ALOT OF TIME."
findings = ["1:8"]
messages = ["よくある綴りの誤り「ALOT」を使っている。正しくは「A LOt」か「ALLOt」"]

[[cases]]
name = "m-three-corrects"
text = "The countrie's flag."
findings = ["1:5"]
messages = ["よくある綴りの誤り「countrie's」を使っている。正しくは「countries」か「countries'」か「country's」"]

[[cases]]
name = "m-correct-capitalized"
text = "He went to carnagie-mellon today."
findings = ["1:12"]
messages = ["よくある綴りの誤り「carnagie-mellon」を使っている。正しくは「Carnegie-Mellon」"]

[[cases]]
name = "m-with-space"
text = "Drink coca cola now."
findings = ["1:7"]
messages = ["よくある綴りの誤り「coca cola」を使っている。正しくは「Coca-Cola」"]

[[cases]]
name = "m-apostrophe"
text = "It dosen't work."
findings = ["1:4"]
messages = ["よくある綴りの誤り「dosen't」を使っている。正しくは「doesn't」"]

[[cases]]
name = "m-apostrophe-end"
text = "The aircrafts' wings."
findings = ["1:5"]
messages = ["よくある綴りの誤り「aircrafts」を使っている。正しくは「aircraft」"]

[[cases]]
name = "m-correct-apostrophe"
text = "It didnt work."
findings = ["1:4"]
messages = ["よくある綴りの誤り「didnt」を使っている。正しくは「didn't」"]

[[cases]]
name = "m-correct-non-ascii"
text = "Go to the creche today."
findings = ["1:11"]
messages = ["よくある綴りの誤り「creche」を使っている。正しくは「crèche」"]

[[cases]]
name = "m-longest"
text = "We abondoned it."
findings = ["1:4"]
messages = ["よくある綴りの誤り「abondoned」を使っている。正しくは「abandoned」"]

[[cases]]
name = "m-shorter"
text = "We abondon it."
findings = ["1:4"]
messages = ["よくある綴りの誤り「abondon」を使っている。正しくは「abandon」"]

[[cases]]
name = "m-word-inside"
text = "The xteh and tehx are fine."
findings = []

[[cases]]
name = "m-underscore"
text = "Use teh_x here."
findings = []

[[cases]]
name = "m-digit"
text = "Use teh2 here."
findings = []

[[cases]]
name = "m-hyphen"
text = "Use teh-x here."
findings = ["1:5"]
messages = ["よくある綴りの誤り「teh」を使っている。正しくは「the」"]

[[cases]]
name = "m-text-start-end"
text = "teh\n\nteh"
findings = ["1:1", "3:1"]
messages = ["よくある綴りの誤り「teh」を使っている。正しくは「the」", "よくある綴りの誤り「teh」を使っている。正しくは「the」"]

[[cases]]
name = "l-only-wikipedia"
note = "`alos` はjafixの一覧 (Wikipediaのrevision 1199637275) にあり、textlintの一覧には無い"
text = "I alos went."
findings = ["1:3"]
messages = ["よくある綴りの誤り「alos」を使っている。正しくは「also」"]

[[cases]]
name = "l-only-wikipedia-non-ascii"
note = "`econoımic` (ı は U+0131) はjafixの一覧にあり、textlintの一覧には無い"
text = "The econoımic plan."
findings = ["1:5"]
messages = ["よくある綴りの誤り「econoımic」を使っている。正しくは「economic」"]

[[cases]]
name = "l-only-textlint"
note = "`dependant` はtextlintの一覧にあり、jafixの一覧には無い"
text = "It is dependant on it."
findings = []

[[cases]]
name = "l-different-value"
note = "`instutions` の正しい語は、jafixの一覧では `institutions,intuitions`、textlintの一覧では `intuitions` で、位置は同じで文面が違う"
text = "The instutions are here."
findings = ["1:5"]
messages = ["よくある綴りの誤り「instutions」を使っている。正しくは「institutions」か「intuitions」"]

[[cases]]
name = "opt-ignore"
builtin = 'common-misspellings = { ignore = ["teh"] }'
text = "I saw teh cat and recieve it."
findings = ["1:19"]
messages = ["よくある綴りの誤り「recieve」を使っている。正しくは「receive」"]

[[cases]]
