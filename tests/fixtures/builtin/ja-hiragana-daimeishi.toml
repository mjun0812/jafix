# ja-hiragana-daimeishi の例。期待値は、textlint 15.8.0 と textlint-rule-ja-hiragana-daimeishi 1.0.0 の実行結果のうち、
# kuromojinとlinderaのトークンが同じ入力のものから作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所で、期待値はjafixの規則から決めた。
# entry-NN のcaseは、辞書(textlintのpackageの辞書の並び)の NN 番目 (0始まり) の項目に当たる入力。
# 当たる入力を作れなかった項目 (辞書の品詞・読みに解析される文が見つからなかった): 2
#
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭の builtin は全caseに当たり、caseに builtin があればその代わりに使う (省略可)
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)

builtin = 'ja-hiragana-daimeishi = true'

[[cases]]
name = "entry-00"
text = "彼処に行く。"
findings = ["1:1"]
messages = ["代名詞「彼処」はひらがなの「あそこ」にする"]

[[cases]]
name = "entry-01"
text = "何処に行く。"
findings = ["1:1"]
messages = ["代名詞「何処」はひらがなの「どこ」にする"]

