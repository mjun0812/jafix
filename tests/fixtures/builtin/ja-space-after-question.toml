text = "驚き？   これ"
findings = ["1:4"]
messages = ["文末の「？」の後に別の文が続くので、直後の半角空白を全角空白にする"]

[[cases]]
name = "sq-multiple"
note = "すべての「？」を見る。textlintは一致を重ねずに探すので、`？ ？` の2つ目の「？」を使う一致を見落とす"
text = "あ？ ？ これ"
findings = ["1:3", "1:5"]
messages = ["文末の「？」の後に別の文が続くので、直後の半角空白を全角空白にする", "文末の「？」の後に別の文が続くので、直後の半角空白を全角空白にする"]

[[cases]]
name = "sq-repeated-sentences"
text = "あ？ い？ う？ え"
findings = ["1:3", "1:6", "1:9"]
messages = ["文末の「？」の後に別の文が続くので、直後の半角空白を全角空白にする", "文末の「？」の後に別の文が続くので、直後の半角空白を全角空白にする", "文末の「？」の後に別の文が続くので、直後の半角空白を全角空白にする"]

