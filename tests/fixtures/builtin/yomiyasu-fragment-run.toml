# yomiyasu-fragment-run の例。期待値は、yomiyasu 3.4.1 の `yomiyasu_lint.py` を文書の種類を指定せずに実行した結果から作った。
# yomiyasuは指摘を行ごとに1件出す。jafixは並びの最初の文に1件を出すので、列と文面はjafixの規則から決めた。
#
# builtin:  設定ファイルの [builtin] の表に書く内容
# name:     caseの名前
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面

builtin = 'yomiyasu-fragment-run = true'

[[cases]]
name = "当たる-効く。重い。安い。"
text = "効く。重い。安い。"
findings = ["1:1"]
messages = ["短い文を3つ以上続けている"]

[[cases]]
name = "当たる-安い。うまい。早い。"
text = "安い。うまい。早い。"
findings = ["1:1"]
messages = ["短い文を3つ以上続けている"]

[[cases]]
name = "当たる-彼は言った。効く。重い。安い。"
text = "彼は言った。効く。重い。安い。"
findings = ["1:7"]
messages = ["短い文を3つ以上続けている"]

[[cases]]
name = "当たる-効く！重い！安い！"
text = "効く！重い！安い！"
findings = ["1:1"]
messages = ["短い文を3つ以上続けている"]

[[cases]]
name = "当たる-前文です。 効く。重い。安い。"
text = "前文です。\n効く。重い。安い。"
findings = ["2:1"]
messages = ["短い文を3つ以上続けている"]

[[cases]]
name = "当たる-- 効く。重い。安い。"
text = "- 効く。重い。安い。"
findings = ["1:3"]
messages = ["短い文を3つ以上続けている"]

[[cases]]
name = "当たらない-1位は「田中。山田。佐藤。」でした。"
text = "1位は「田中。山田。佐藤。」でした。"
findings = []
messages = []

[[cases]]
name = "当たらない-速い。軽い。"
text = "速い。軽い。"
findings = []
messages = []

[[cases]]
name = "当たらない-これは速い。とても軽い。そして安い。"
text = "これは速い。とても軽い。そして安い。"
findings = []
messages = []

[[cases]]
name = "当たらない-効く。 重い。 安い。"
text = "効く。 重い。 安い。"
findings = []
messages = []

[[cases]]
name = "当たらない-## 効く。重い。安い。"
text = "## 効く。重い。安い。"
findings = []
messages = []
