# ja-space-between-half-and-full-width の例。期待値は、textlint 15.8.0 と textlint-rule-ja-space-between-half-and-full-width 3.0.4 (textlint-rule-preset-ja-spacing 3.0.4) の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所か、既存の修正ルールと組み合わさる箇所で、期待値は設計の規則から決めた。
#
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を全caseに当て、caseに書けばそちらだけを使う
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘と箇所の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    修正ルールだけが持つ。`jafix fix` の後の内容から、末尾の改行を除いたもの。2回目の `jafix fix` で変わらないことも確かめる

builtin = '''
ja-space-between-half-and-full-width = true
space-between-ja-and-alnum = false
space-between-ja-and-paren = false
fullwidth-paren = false
'''

[[cases]]
name = "jb-basic"
text = "日本語 Rust と 123 です"
findings = ["1:4", "1:9", "1:11", "1:15"]
messages = ["全角文字と半角文字の間の空白を削除する", "全角文字と半角文字の間の空白を削除する", "全角文字と半角文字の間の空白を削除する", "全角文字と半角文字の間の空白を削除する"]
fixed = "日本語Rustと123です"

[[cases]]
name = "jb-both-orders"
text = "Rust 日本語 C と 4 言語"
findings = ["1:5", "1:9", "1:11", "1:13", "1:15"]
messages = ["全角文字と半角文字の間の空白を削除する", "全角文字と半角文字の間の空白を削除する", "全角文字と半角文字の間の空白を削除する", "全角文字と半角文字の間の空白を削除する", "全角文字と半角文字の間の空白を削除する"]
fixed = "Rust日本語Cと4言語"

[[cases]]
name = "jb-fullwidth-space"
text = "日本語\u3000Rust"
findings = ["1:4"]
messages = ["全角文字と半角文字の間の空白を削除する"]
fixed = "日本語Rust"

[[cases]]
name = "jb-two-spaces"
text = "日本語  Rust と\u3000 123 です"
findings = ["1:10", "1:17"]
messages = ["全角文字と半角文字の間の空白を削除する", "全角文字と半角文字の間の空白を削除する"]
fixed = "日本語  Rustと\u3000 123です"

