# 2.1.10.算用数字の位取りの表記 の例。期待値は、textlint 15.8.0 と textlint-rule-preset-jtf-style 3.0.3 の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所か、既存の修正ルールと組み合わさる箇所で、期待値は設計の規則から決めた。
#
# rule:     指摘の行の `[<rule-id>]` のID (fixtureのファイル名はIDを使えないので、ここに書く)
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を全caseに当て、caseに書けばそちらだけを使う
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘と箇所の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    修正ルールだけが持つ。`jafix fix` の後の内容から、末尾の改行を除いたもの。2回目の `jafix fix` で変わらないことも確かめる

rule = "2.1.10.算用数字の位取りの表記"
builtin = '''
"2.1.10.算用数字の位取りの表記" = true
'''

[[cases]]
name = "dc-basic"
text = "0,5 と 10,000 と 00,5"
findings = ["1:2", "1:18"]
messages = ["小数点に「,」を使わず「.」にする", "小数点に「,」を使わず「.」にする"]

[[cases]]
name = "dc-decimal-with-comma"
text = "円周率は3,14です"
findings = []

[[cases]]
name = "dc-zero-point"
text = "0,5"
findings = ["1:2"]
messages = ["小数点に「,」を使わず「.」にする"]

[[cases]]
name = "dc-zero-point-several-digits"
text = "0,123 と 0,5"
findings = ["1:2", "1:10"]
messages = ["小数点に「,」を使わず「.」にする", "小数点に「,」を使わず「.」にする"]

[[cases]]
name = "dc-leading-zeros"
text = "00,5 と 000,25"
findings = ["1:3", "1:11"]
messages = ["小数点に「,」を使わず「.」にする", "小数点に「,」を使わず「.」にする"]

[[cases]]
name = "dc-thousands-separator"
text = "10,000 と 1,234,567"
findings = []

[[cases]]
name = "dc-thousands-separator-only"
text = "1,234"
findings = []

[[cases]]
name = "dc-zero-then-thousands"
text = "0,000"
findings = ["1:2"]
messages = ["小数点に「,」を使わず「.」にする"]

[[cases]]
name = "dc-zero-then-two-groups"
text = "0,123,456"
findings = []

[[cases]]
name = "dc-nonzero-first"
text = "1,5 と 12,5"
findings = []

[[cases]]
name = "dc-comma-without-digits"
text = "0, と ,5 と a,5"
findings = []

[[cases]]
name = "dc-period"
text = "0.5 と 10.000"
findings = []

[[cases]]
name = "dc-fullwidth-comma"
text = "０，５"
findings = []

[[cases]]
name = "dc-japanese-comma"
text = "0、5"
findings = []

[[cases]]
name = "dc-in-sentence"
text = "割合は 0,25 です。残りは 0,75 です"
findings = ["1:6", "1:18"]
messages = ["小数点に「,」を使わず「.」にする", "小数点に「,」を使わず「.」にする"]

[[cases]]
name = "dc-two-lines"
text = "0,5\n00,5"
findings = ["1:2", "2:3"]
messages = ["小数点に「,」を使わず「.」にする", "小数点に「,」を使わず「.」にする"]

[[cases]]
name = "dc-surrogate-pair-before"
text = "\U00020bb7野家は0,5円"
findings = ["1:6"]
messages = ["小数点に「,」を使わず「.」にする"]

[[cases]]
name = "dc-after-inline-code"
text = "`x`0,5"
findings = ["1:5"]
messages = ["小数点に「,」を使わず「.」にする"]

[[cases]]
name = "dc-before-strong"
text = "0,5**強調**"
findings = ["1:2"]
messages = ["小数点に「,」を使わず「.」にする"]

[[cases]]
name = "dc-inside-letters"
text = "a0,5b"
findings = ["1:3"]
messages = ["小数点に「,」を使わず「.」にする"]

[[cases]]
name = "dc-heading"
text = "# 0,5"
findings = []

[[cases]]
name = "dc-quote"
text = "> 0,5"
findings = []

[[cases]]
name = "dc-table"
text = "| 列 |\n| - |\n| 0,5 |"
findings = []

[[cases]]
name = "dc-list"
text = "- 0,5"
findings = ["1:4"]
messages = ["小数点に「,」を使わず「.」にする"]

[[cases]]
name = "dc-link"
text = "[0,5](https://example.com)"
findings = []

[[cases]]
name = "dc-strong"
text = "**0,5**"
findings = []

[[cases]]
name = "dc-emphasis"
