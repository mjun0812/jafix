# no-short-topic-comma の例。期待値は、textlint 15.8.0、@textlint-ja/textlint-rule-preset-ai-writing 1.7.0、
# textlint-rule-preset-ai-words-ja 1.2.1 の実行結果のうち、
# kuromojinとlinderaのトークンが同じ入力のものから作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所で、期待値はjafixの規則から決めた。
#
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭の builtin は全caseに当たり、caseに builtin があればその代わりに使う (省略可)
# name:     caseの名前
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)

builtin = 'no-short-topic-comma = true'

[[cases]]
name = "basic-3chars"
note = "textlint 15.8.0は `true` ではルールを有効にしない (`{}` か `maxLength` を渡すと有効になる)が、jafixは `no-short-topic-comma = true` で有効にし、`maxLength` は既定の5である"
text = "今日は、晴れです。"
findings = ["1:4"]
messages = ["主題を3文字示しただけで読点を打っている"]

[[cases]]
name = "basic-5chars"
