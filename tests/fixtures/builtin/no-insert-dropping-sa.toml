[[cases]]
name = "pos-after-link"
text = "[リンク](https://example.com) 辛さそうだ。"
findings = ["1:29"]
messages = ["さ入れ言葉「辛さそう」は「辛そう」にする"]

[[cases]]
name = "pos-astral-before"
note = "textlintは位置を文字(コードポイント)の数で求めてUTF-16の位置として使うため、サロゲートペアの文字の分だけ前にずれた位置を指摘する(置き換えも別の文字になる)が、jafixは元のソースの位置(文字で数える)を指摘する"
text = "\U0001f600辛さそうだ。"
findings = ["1:3"]
messages = ["さ入れ言葉「辛さそう」は「辛そう」にする"]

[[cases]]
name = "pos-astral-before-dropping"
note = "textlintは位置を文字(コードポイント)の数で求めてUTF-16の位置として使うため、サロゲートペアの文字の分だけ前にずれた位置を指摘する(置き換えも別の文字になる)が、jafixは元のソースの位置(文字で数える)を指摘する"
text = "\U0001f600これは良そうな案だ。"
findings = ["1:5"]
messages = ["さ抜き言葉「良そう」は「良さそう」にする"]

[[cases]]
name = "carry-over-strong"
note = "textlintは照合の状態を本文の範囲(Str)をまたいで持ち越し、前の本文の範囲の `食べ` `た` と次の本文の範囲の `さ` `そう` を1つの一致として指摘するが、jafixは本文の範囲ごとに状態を捨てる"
text = "彼女は食べた**さそうだ**。"
findings = []
messages = []

[[cases]]
name = "carry-over-link"
note = "textlintは照合の状態を本文の範囲(Str)をまたいで持ち越し、前の本文の範囲の `食べ` `た` と次の本文の範囲の `さ` `そう` を1つの一致として指摘するが、jafixは本文の範囲ごとに状態を捨てる"
text = "彼女は食べた[さそうだ](https://example.com)。"
findings = []
messages = []

[[cases]]
name = "carry-over-paragraph"
note = "textlintは照合の状態を本文の範囲(Str)をまたいで持ち越し、前の本文の範囲の `食べ` `た` と次の本文の範囲の `さ` `そう` を1つの一致として指摘するが、jafixは本文の範囲ごとに状態を捨てる"
text = "彼女は食べた\n\nさそうだ。"
findings = []
messages = []

[[cases]]
name = "restart-after-failed-match"
note = "textlintは一致の途中で外れたトークン(`続け`)を次の一致の先頭として見直さず、 `食べ` から始めた一致が `続け` で外れた後は `た` `さ` `そう` に当たらないが、jafixはすべての位置から当てるので `続け` から始めた一致を指摘する"
text = "食べ続けたさそうな顔をしている。"
findings = ["1:6"]
messages = ["さ入れ言葉「続けたさそう」は「続けたそう」にする"]

[[cases]]
name = "restart-without-failure"
text = "食べて見たさそうな顔をしている。"
findings = ["1:6"]
messages = ["さ入れ言葉「見たさそう」は「見たそう」にする"]

[[cases]]
name = "nonprose-bare-url"
note = "textlintは裸のURLの文字列も見て指摘するが、jafixは裸のURLを本文の範囲にしない"
text = "https://example.com/辛さそうだ"
findings = []
messages = []

[[cases]]
name = "nonprose-autolink"
note = "textlintは自動リンクの文字列も見て指摘するが、jafixは自動リンクを本文の範囲にしない"
text = "<https://example.com/辛さそうだ>"
findings = []
messages = []

[[cases]]
name = "nonprose-shortcut-reference"
note = "textlintは省略形の参照リンクの文字列も見て指摘するが、jafixは本文の範囲にしない"
text = "[辛さそうだ]\n\n[辛さそうだ]: https://example.com"
findings = []
messages = []

[[cases]]
name = "nonprose-collapsed-reference"
note = "textlintはcollapsed形の参照リンクの文字列も見て指摘するが、jafixは本文の範囲にしない"
text = "[辛さそうだ][]\n\n[辛さそうだ]: https://example.com"
findings = []
messages = []

[[cases]]
name = "prose-full-reference"
text = "[辛さそうだ][a]\n\n[a]: https://example.com"
findings = ["1:3"]
messages = ["さ入れ言葉「辛さそう」は「辛そう」にする"]

[[cases]]
name = "prose-after-bare-url"
text = "https://example.com の後で辛さそうだ。"
findings = ["1:25"]
messages = ["さ入れ言葉「辛さそう」は「辛そう」にする"]
