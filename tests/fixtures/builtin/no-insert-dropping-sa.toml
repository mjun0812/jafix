messages = ["さ抜き言葉「無そう」は「無さそう」にする"]

[[cases]]
name = "entry-2-yoi-modifier"
text = "これは良そうな案だ。"
findings = ["1:4"]
messages = ["さ抜き言葉「良そう」は「良さそう」にする"]

