# @textlint-ja/no-insert-dropping-sa の例。期待値は、textlint 15.8.0 と @textlint-ja/textlint-rule-no-insert-dropping-sa 2.0.1 の実行結果のうち、
# kuromojinとlinderaのトークンが同じ入力のものから作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所で、期待値はjafixの規則から決めた。
#
# rule:     指摘の行の `[<rule-id>]` に出るルールのID。ファイル名と違うので書く (省略するとファイル名)
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭の builtin は全caseに当たり、caseに builtin があればその代わりに使う (省略可)
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)

rule = "@textlint-ja/no-insert-dropping-sa"
builtin = '"@textlint-ja/no-insert-dropping-sa" = true'

[[cases]]
name = "entry-0-karai"
text = "このカレーは辛さそうだ。"
findings = ["1:8"]
messages = ["さ入れ言葉「辛さそう」は「辛そう」にする"]

[[cases]]
name = "entry-0-oishii"
text = "美味しさそうな料理だ。"
findings = ["1:4"]
messages = ["さ入れ言葉「美味しさそう」は「美味しそう」にする"]

[[cases]]
name = "entry-0-samui"
text = "寒さそうに見える。"
findings = ["1:2"]
messages = ["さ入れ言葉「寒さそう」は「寒そう」にする"]

[[cases]]
name = "entry-0-after-comma-free"
text = "辛い辛さそうだ。"
findings = ["1:4"]
messages = ["さ入れ言葉「辛さそう」は「辛そう」にする"]

[[cases]]
name = "entry-1-tabeta"
text = "食べたさそうな顔をしている。"
findings = ["1:4"]
messages = ["さ入れ言葉「食べたさそう」は「食べたそう」にする"]

[[cases]]
name = "entry-1-ikita"
text = "行きたさそうに見える。"
findings = ["1:4"]
messages = ["さ入れ言葉「行きたさそう」は「行きたそう」にする"]

[[cases]]
name = "entry-1-mita"
text = "見たさそうだ。"
