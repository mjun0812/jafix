messages = ["さ入れ言葉「見たさそう」は「見たそう」にする"]

[[cases]]
name = "entry-2-yoi"
text = "この案は良そうだ。"
findings = ["1:5"]
messages = ["さ抜き言葉「良そう」は「良さそう」にする"]

[[cases]]
name = "entry-2-nai"
