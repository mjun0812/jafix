note = "前に文字が無い側は判定しない。textlintは `before: true` で、文書の先頭の強調にも、強調の中の文字を前の文字とみなして指摘を出す"
builtin = '''
ja-space-around-emphasis = { before = true, after = false }
space-between-ja-and-alnum = false
space-between-ja-and-paren = false
fullwidth-paren = false
'''
text = "*日本*の説明"
findings = []
fixed = "*日本*の説明"

[[cases]]
name = "ae-multiple"
text = "日本語 *a* と *b* 日本語"
findings = ["1:4", "1:8", "1:10", "1:14"]
messages = ["強調の前の空白を削除する", "強調の後の空白を削除する", "強調の前の空白を削除する", "強調の後の空白を削除する"]
fixed = "日本語*a*と*b*日本語"

[[cases]]
name = "ae-adjacent-emphasis"
text = "日本語 *a* *b* 日本語"
findings = ["1:4", "1:12"]
messages = ["強調の前の空白を削除する", "強調の後の空白を削除する"]
fixed = "日本語*a* *b*日本語"
