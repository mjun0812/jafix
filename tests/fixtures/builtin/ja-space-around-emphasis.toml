# ja-space-around-emphasis の例。期待値は、textlint 15.8.0 と textlint-rule-ja-space-around-emphasis 3.0.4 (textlint-rule-preset-ja-spacing 3.0.4) の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所か、既存の修正ルールと組み合わさる箇所で、期待値は設計の規則から決めた。
#
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を全caseに当て、caseに書けばそちらだけを使う
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘と箇所の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    修正ルールだけが持つ。`jafix fix` の後の内容から、末尾の改行を除いたもの。2回目の `jafix fix` で変わらないことも確かめる

builtin = '''
ja-space-around-emphasis = true
space-between-ja-and-alnum = false
space-between-ja-and-paren = false
fullwidth-paren = false
'''

[[cases]]
name = "ae-basic"
text = "日本語 *x* 日本語"
findings = ["1:4", "1:8"]
messages = ["強調の前の空白を削除する", "強調の後の空白を削除する"]
fixed = "日本語*x*日本語"

[[cases]]
name = "ae-before-only"
text = "日本語 *x*日本語"
findings = ["1:4"]
messages = ["強調の前の空白を削除する"]
fixed = "日本語*x*日本語"

[[cases]]
name = "ae-after-only"
note = "`after = false` の箇所の位置は、消す空白である。textlintは指摘を空白の次の文字に出す (修正の範囲は空白)"
text = "日本語*x* 日本語"
findings = ["1:7"]
messages = ["強調の後の空白を削除する"]
fixed = "日本語*x*日本語"

[[cases]]
name = "ae-no-space"
text = "日本語*x*日本語"
findings = []
fixed = "日本語*x*日本語"

[[cases]]
name = "ae-fullwidth-space"
text = "日本語\u3000*x*\u3000日本語"
findings = []
fixed = "日本語\u3000*x*\u3000日本語"

[[cases]]
name = "ae-two-spaces"
text = "日本語  *x*  日本語"
findings = []
fixed = "日本語  *x*  日本語"

[[cases]]
name = "ae-english-neighbors"
text = "English *x* English と 123 *x* 456"
findings = []
fixed = "English *x* English と 123 *x* 456"

[[cases]]
name = "ae-english-one-side"
text = "English *x* 日本語 と 日本語 *x* English"
findings = ["1:12", "1:22"]
messages = ["強調の後の空白を削除する", "強調の前の空白を削除する"]
fixed = "English *x*日本語 と 日本語*x* English"

[[cases]]
name = "ae-not-japanese-chars"
text = "ー *x* ー と 々 *x* 々 と 。 *x* 、 と 〇 *x* 〇 と ・ *x* ・"
findings = []
fixed = "ー *x* ー と 々 *x* 々 と 。 *x* 、 と 〇 *x* 〇 と ・ *x* ・"

[[cases]]
name = "ae-range-edges"
text = "ぁ *x*\nん *x*\nゔ *x*\nァ *x*\nヶ *x*\nヷ *x*\n㐀 *x*\n䶿 *x*\n䷀ *x*\n豈 *x*\n﫿 *x*"
findings = ["1:2", "2:2", "4:2", "5:2", "7:2", "8:2", "10:2", "11:2"]
messages = ["強調の前の空白を削除する", "強調の前の空白を削除する", "強調の前の空白を削除する", "強調の前の空白を削除する", "強調の前の空白を削除する", "強調の前の空白を削除する", "強調の前の空白を削除する", "強調の前の空白を削除する"]
fixed = "ぁ*x*\nん*x*\nゔ *x*\nァ*x*\nヶ*x*\nヷ *x*\n㐀*x*\n䶿*x*\n䷀ *x*\n豈*x*\n﫿*x*"

[[cases]]
name = "ae-surrogate-kanji"
note = "文字で日本語かを判定し、U+20000からU+2FFFFの漢字も日本語の文字に数える。textlintはUTF-16の1単位で判定するので、サロゲートペアの漢字の隣を見落とす"
text = "\U00020bb7 *x* \U00020bb7"
findings = ["1:2", "1:6"]
messages = ["強調の前の空白を削除する", "強調の後の空白を削除する"]
fixed = "\U00020bb7*x*\U00020bb7"

[[cases]]
name = "ae-document-start"
text = "*x* 日本語"
findings = ["1:4"]
messages = ["強調の後の空白を削除する"]
fixed = "*x*日本語"

[[cases]]
name = "ae-document-end"
text = "日本語 *x*"
findings = ["1:4"]
messages = ["強調の前の空白を削除する"]
fixed = "日本語*x*"

[[cases]]
name = "ae-line-boundaries"
text = "日本語\n*x* 日本語\n日本語 *x*\n日本語"
findings = ["2:4", "3:4"]
messages = ["強調の後の空白を削除する", "強調の前の空白を削除する"]
fixed = "日本語\n*x*日本語\n日本語*x*\n日本語"

[[cases]]
name = "ae-continuation-indent"
text = "日本語\n  *x* 日本語"
findings = ["2:6"]
messages = ["強調の後の空白を削除する"]
fixed = "日本語\n  *x*日本語"

[[cases]]
name = "ae-two-nodes"
text = "日本語 *x* *x* 日本語"
findings = ["1:4", "1:12"]
messages = ["強調の前の空白を削除する", "強調の後の空白を削除する"]
fixed = "日本語*x* *x*日本語"

[[cases]]
name = "ae-list"
text = "- 日本語 *x* 日本語"
findings = ["1:6", "1:10"]
messages = ["強調の前の空白を削除する", "強調の後の空白を削除する"]
fixed = "- 日本語*x*日本語"

[[cases]]
name = "ae-list-continuation"
text = "- 項目\n  日本語 *x* 日本語"
findings = ["2:6", "2:10"]
messages = ["強調の前の空白を削除する", "強調の後の空白を削除する"]
fixed = "- 項目\n  日本語*x*日本語"

[[cases]]
name = "ae-quote"
text = "> 日本語 *x* 日本語"
findings = ["1:6", "1:10"]
messages = ["強調の前の空白を削除する", "強調の後の空白を削除する"]
fixed = "> 日本語*x*日本語"

[[cases]]
name = "ae-table"
text = "| a |\n| - |\n| 日本語 *x* 日本語 |"
findings = ["3:6", "3:10"]
messages = ["強調の前の空白を削除する", "強調の後の空白を削除する"]
fixed = "| a |\n| - |\n| 日本語*x*日本語 |"

[[cases]]
name = "ae-heading"
note = "見出しの中のnodeも見るが、見出しの文字を変えるとアンカーが変わるので、直さずに指摘にする。textlintは見出しの空白も消す"
text = "# 日本語 *x* 日本語"
findings = ["1:6", "1:10"]
messages = ["強調の前の空白を削除する。見出しのアンカーが変わるので、見出しへのリンクも直す", "強調の後の空白を削除する。見出しのアンカーが変わるので、見出しへのリンクも直す"]
fixed = "# 日本語 *x* 日本語"

[[cases]]
name = "ae-setext-heading"
note = "setext形式の見出しも、直さずに指摘にする"
text = "日本語 *x* 日本語\n==="
findings = ["1:4", "1:8"]
messages = ["強調の前の空白を削除する。見出しのアンカーが変わるので、見出しへのリンクも直す", "強調の後の空白を削除する。見出しのアンカーが変わるので、見出しへのリンクも直す"]
fixed = "日本語 *x* 日本語\n==="

[[cases]]
name = "ae-link-text"
text = "[日本語 *x* 日本語](https://example.com)"
findings = ["1:5", "1:9"]
messages = ["強調の前の空白を削除する", "強調の後の空白を削除する"]
fixed = "[日本語*x*日本語](https://example.com)"

[[cases]]
name = "ae-in-strong"
text = "**日本語 *x* 日本語**"
findings = ["1:6", "1:10"]
messages = ["強調の前の空白を削除する", "強調の後の空白を削除する"]
fixed = "**日本語*x*日本語**"

[[cases]]
name = "ae-in-delete"
text = "~~日本語 *x* 日本語~~"
findings = ["1:6", "1:10"]
messages = ["強調の前の空白を削除する", "強調の後の空白を削除する"]
fixed = "~~日本語*x*日本語~~"

[[cases]]
name = "ae-with-default-fix-rules"
