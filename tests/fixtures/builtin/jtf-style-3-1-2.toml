# 3.1.2.全角文字どうし の例。期待値は、textlint 15.8.0 と textlint-rule-preset-jtf-style 3.0.3 の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所か、既存の修正ルールと組み合わさる箇所で、期待値は設計の規則から決めた。
#
# rule:     指摘の行の `[<rule-id>]` のID (fixtureのファイル名はIDを使えないので、ここに書く)
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を全caseに当て、caseに書けばそちらだけを使う
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘と箇所の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    修正ルールだけが持つ。`jafix fix` の後の内容から、末尾の改行を除いたもの。2回目の `jafix fix` で変わらないことも確かめる

rule = "3.1.2.全角文字どうし"
builtin = '''
"3.1.2.全角文字どうし" = true
'''

[[cases]]
name = "fj-basic"
text = "日本語 日本語"
findings = ["1:4"]
messages = ["全角文字どうしの間の空白を削除する"]
fixed = "日本語日本語"

[[cases]]
name = "fj-kanji-hiragana"
text = "漢字 ひらがな"
findings = ["1:3"]
messages = ["全角文字どうしの間の空白を削除する"]
fixed = "漢字ひらがな"

[[cases]]
name = "fj-hiragana-kanji"
text = "ひらがな 漢字"
findings = ["1:5"]
messages = ["全角文字どうしの間の空白を削除する"]
fixed = "ひらがな漢字"

[[cases]]
name = "fj-katakana-both-is-not-checked"
text = "カタカナ カタカナ"
findings = []
fixed = "カタカナ カタカナ"

[[cases]]
name = "fj-katakana-kanji"
text = "カタカナ 漢字"
findings = ["1:5"]
messages = ["全角文字どうしの間の空白を削除する"]
fixed = "カタカナ漢字"

[[cases]]
name = "fj-katakana-hiragana"
text = "ひらがな カタカナ"
findings = ["1:5"]
messages = ["全角文字どうしの間の空白を削除する"]
fixed = "ひらがなカタカナ"

[[cases]]
name = "fj-fullwidth-space-is-not-checked"
text = "日本語\u3000日本語"
findings = []
fixed = "日本語\u3000日本語"

[[cases]]
name = "fj-two-spaces-are-not-checked"
text = "日本語  日本語"
findings = []
fixed = "日本語  日本語"

[[cases]]
name = "fj-long-vowel-is-not-japanese"
text = "サーバー 日本語"
findings = []
fixed = "サーバー 日本語"

[[cases]]
name = "fj-long-vowel-then-katakana"
text = "サーバー サーバー"
findings = []
fixed = "サーバー サーバー"

[[cases]]
name = "fj-kanji-then-katakana-with-long-vowel"
text = "日本語 サーバー"
findings = ["1:4"]
messages = ["全角文字どうしの間の空白を削除する"]
fixed = "日本語サーバー"

[[cases]]
name = "fj-punctuation-is-not-japanese"
text = "日本語。 日本語、 日本語"
findings = []
fixed = "日本語。 日本語、 日本語"

[[cases]]
name = "fj-repetition-mark-is-japanese"
text = "人々 日本"
findings = ["1:3"]
messages = ["全角文字どうしの間の空白を削除する"]
fixed = "人々日本"

[[cases]]
name = "fj-repetition-mark-after-space"
text = "日本 々"
findings = ["1:3"]
messages = ["全角文字どうしの間の空白を削除する"]
fixed = "日本々"

[[cases]]
name = "fj-zero-mark"
text = "〇 日"
findings = ["1:2"]
messages = ["全角文字どうしの間の空白を削除する"]
fixed = "〇日"

[[cases]]
name = "fj-closing-mark"
text = "日 〻"
findings = ["1:2"]
messages = ["全角文字どうしの間の空白を削除する"]
fixed = "日〻"

[[cases]]
name = "fj-surrogate-pair-kanji"
text = "\U00020bb7 野家"
findings = ["1:2"]
messages = ["全角文字どうしの間の空白を削除する"]
fixed = "\U00020bb7野家"

[[cases]]
name = "fj-surrogate-pair-kanji-after"
text = "野家 \U00020bb7"
findings = ["1:3"]
messages = ["全角文字どうしの間の空白を削除する"]
fixed = "野家\U00020bb7"

[[cases]]
name = "fj-tab-is-not-checked"
text = "日本語\t日本語"
findings = []
fixed = "日本語\t日本語"

[[cases]]
name = "fj-newline-is-not-space"
text = "日本語\n日本語"
findings = []
fixed = "日本語\n日本語"

[[cases]]
name = "fj-two-lines"
text = "日本語 日本語\nひらがな 漢字"
findings = ["1:4", "2:5"]
messages = ["全角文字どうしの間の空白を削除する", "全角文字どうしの間の空白を削除する"]
fixed = "日本語日本語\nひらがな漢字"

[[cases]]
name = "fj-every-space-of-a-run"
note = "前後の文字で判定するので、すべての空白を指摘する。textlintは一致を重ねずに探すので、`日 本 語` の2つ目の空白を見落とし、1回の `--fix` では1つしか消えない"
text = "日 本 語"
findings = ["1:2", "1:4"]
messages = ["全角文字どうしの間の空白を削除する", "全角文字どうしの間の空白を削除する"]
fixed = "日本語"

[[cases]]
name = "fj-every-space-of-a-long-run"
note = "すべての空白を指摘する。textlintは `日`・`本`・`語` の間のうち、一致を重ねない1つおきの空白だけを指摘する"
text = "あ い う え"
findings = ["1:2", "1:4", "1:6"]
messages = ["全角文字どうしの間の空白を削除する", "全角文字どうしの間の空白を削除する", "全角文字どうしの間の空白を削除する"]
fixed = "あいうえ"

[[cases]]
name = "fj-katakana-between-hiragana"
note = "前後がどちらもカタカナのときだけ外す。`ア い ウ` の2つの空白はどちらもカタカナどうしでなく、すべて指摘する。textlintは2つ目の空白を見落とす"
text = "ア い ウ"
findings = ["1:2", "1:4"]
messages = ["全角文字どうしの間の空白を削除する", "全角文字どうしの間の空白を削除する"]
fixed = "アいウ"

[[cases]]
name = "fj-every-space-of-a-run-of-kanji"
note = "すべての空白を指摘する。textlintは1つおきの空白だけを指摘する"
text = "一 二 三 四 五"
findings = ["1:2", "1:4", "1:6", "1:8"]
messages = ["全角文字どうしの間の空白を削除する", "全角文字どうしの間の空白を削除する", "全角文字どうしの間の空白を削除する", "全角文字どうしの間の空白を削除する"]
fixed = "一二三四五"

[[cases]]
name = "fj-overlaps-ja-no-space-between-full-width"
note = "`ja-no-space-between-full-width` が有効なら、同じ範囲の箇所はルールの一覧で前にある `ja-no-space-between-full-width` の箇所が残り、`3.1.2` の箇所は出ない。結果は同じである"
builtin = '''
"3.1.2.全角文字どうし" = true
ja-no-space-between-full-width = true
'''
text = "日本語 日本語"
findings = []
fixed = "日本語日本語"

[[cases]]
name = "fj-heading"
text = "# 日本語 日本語"
findings = []
fixed = "# 日本語 日本語"

[[cases]]
name = "fj-quote"
text = "> 日本語 日本語"
findings = []
fixed = "> 日本語 日本語"

[[cases]]
name = "fj-table"
text = "| 列 |\n| - |\n| 日本語 日本語 |"
findings = []
fixed = "| 列 |\n| - |\n| 日本語 日本語 |"

[[cases]]
name = "fj-list"
text = "- 日本語 日本語"
findings = ["1:6"]
messages = ["全角文字どうしの間の空白を削除する"]
fixed = "- 日本語日本語"

[[cases]]
name = "fj-link"
text = "[日本語 日本語](https://example.com)"
findings = []
fixed = "[日本語 日本語](https://example.com)"

[[cases]]
name = "fj-strong"
text = "**日本語 日本語**"
findings = []
fixed = "**日本語 日本語**"

[[cases]]
name = "fj-emphasis"
text = "*日本語 日本語*"
findings = []
fixed = "*日本語 日本語*"

[[cases]]
name = "fj-strike"
text = "~~日本語 日本語~~"
findings = []
fixed = "~~日本語 日本語~~"

[[cases]]
name = "fj-code"
text = "`日本語 日本語`"
findings = []
fixed = "`日本語 日本語`"

[[cases]]
name = "fj-footnote"
text = "[^1]: 日本語 日本語"
findings = ["1:10"]
messages = ["全角文字どうしの間の空白を削除する"]
fixed = "[^1]: 日本語日本語"

[[cases]]
name = "fj-html"
text = "<span>日本語 日本語</span>"
findings = ["1:10"]
messages = ["全角文字どうしの間の空白を削除する"]
fixed = "<span>日本語日本語</span>"
