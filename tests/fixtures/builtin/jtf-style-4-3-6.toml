# 4.3.6.中かっこ{ } の例。期待値は、textlint 15.8.0 と textlint-rule-preset-jtf-style 3.0.3 の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所か、既存の修正ルールと組み合わさる箇所で、期待値は設計の規則から決めた。
#
# rule:     指摘の行の `[<rule-id>]` のID (fixtureのファイル名はIDを使えないので、ここに書く)
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を全caseに当て、caseに書けばそちらだけを使う
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘と箇所の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    修正ルールだけが持つ。`jafix fix` の後の内容から、末尾の改行を除いたもの。2回目の `jafix fix` で変わらないことも確かめる

rule = "4.3.6.中かっこ{ }"
builtin = '''
"4.3.6.中かっこ{ }" = true
'''

[[cases]]
name = "cb-opening-only"
text = "{これは"
findings = ["1:1"]
messages = ["{ に対応する } が無い"]

[[cases]]
name = "cb-closing-only"
text = "これは}"
findings = ["1:4"]
messages = ["} に対応する { が無い"]

[[cases]]
name = "cb-matched"
text = "{これは}"
findings = []

[[cases]]
name = "cb-matched-then-opening"
text = "{これは}と{あれ"
findings = ["1:7"]
messages = ["{ に対応する } が無い"]

[[cases]]
name = "cb-matched-twice"
text = "{あ}と{い}"
findings = []

[[cases]]
name = "cb-nested"
text = "{{a}}"
findings = []

[[cases]]
name = "cb-extra-closing"
text = "{a}}"
findings = ["1:4"]
messages = ["} に対応する { が無い"]

[[cases]]
name = "cb-closing-before-opening"
text = "}a{"
findings = ["1:1", "1:3"]
messages = ["} に対応する { が無い", "{ に対応する } が無い"]

[[cases]]
name = "cb-extra-opening"
text = "{a{b}"
findings = ["1:1"]
messages = ["{ に対応する } が無い"]

[[cases]]
name = "cb-across-paragraphs"
text = "{これは\n\nあれ}"
findings = ["1:1", "3:3"]
messages = ["{ に対応する } が無い", "} に対応する { が無い"]

[[cases]]
name = "cb-open-in-each-paragraph"
text = "{これは\n\n{あれ"
findings = ["1:1", "3:1"]
messages = ["{ に対応する } が無い", "{ に対応する } が無い"]

[[cases]]
name = "cb-across-lines-of-a-paragraph"
text = "{これは\nあれ}"
findings = []

[[cases]]
name = "cb-across-list-items"
text = "- {b\n- c}"
findings = ["1:3", "2:4"]
messages = ["{ に対応する } が無い", "} に対応する { が無い"]

[[cases]]
name = "cb-in-list-item"
text = "- {これは"
findings = ["1:3"]
messages = ["{ に対応する } が無い"]

[[cases]]
name = "cb-quote-is-skipped"
