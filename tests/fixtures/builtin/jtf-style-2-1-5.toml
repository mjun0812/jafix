# 2.1.5.カタカナ の例。期待値は、textlint 15.8.0 と textlint-rule-preset-jtf-style 3.0.3 の実行結果から作った。textlintでは、presetの既定で無効なルールを `{}` で有効にした。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所か、既存の修正ルールと組み合わさる箇所で、期待値は設計の規則から決めた。
#
# rule:     指摘の行の `[<rule-id>]` のID (fixtureのファイル名はIDを使えないので、ここに書く)
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を全caseに当て、caseに書けばそちらだけを使う
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘と箇所の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    修正ルールだけが持つ。`jafix fix` の後の内容から、末尾の改行を除いたもの。2回目の `jafix fix` で変わらないことも確かめる

rule = "2.1.5.カタカナ"
builtin = '''
"2.1.5.カタカナ" = true
no-hankaku-kana = false
'''

[[cases]]
name = "kn-halfwidth-basic"
text = "\uff71\uff72\uff73\uff74\uff75と\uff8a\uff9f\uff9d"
findings = ["1:1", "1:7"]
messages = ["半角カナ「\uff71\uff72\uff73\uff74\uff75」を全角にする", "半角カナ「\uff8a\uff9f\uff9d」を全角にする"]
fixed = "アイウエオとパン"

[[cases]]
name = "kn-halfwidth-voiced-and-semivoiced"
text = "\uff76\uff9e\uff77\uff9e\uff78\uff9eと\uff8a\uff9f\uff8b\uff9f\uff8c\uff9f"
findings = ["1:1", "1:8"]
messages = ["半角カナ「\uff76\uff9e\uff77\uff9e\uff78\uff9e」を全角にする", "半角カナ「\uff8a\uff9f\uff8b\uff9f\uff8c\uff9f」を全角にする"]
fixed = "ガギグとパピプ"

[[cases]]
name = "kn-halfwidth-lone-marks"
text = "\uff76\uff9e\uff9e \uff9e \uff9f"
findings = ["1:1", "1:5", "1:7"]
messages = ["半角カナ「\uff76\uff9e\uff9e」を全角にする", "半角カナ「\uff9e」を全角にする", "半角カナ「\uff9f」を全角にする"]
fixed = "ガ\u309b \u309b \u309c"

[[cases]]
name = "kn-halfwidth-long-vowel"
text = "\uff7b\uff70\uff8a\uff9e\uff70"
findings = ["1:1"]
messages = ["半角カナ「\uff7b\uff70\uff8a\uff9e\uff70」を全角にする"]
fixed = "サーバー"

[[cases]]
name = "kn-halfwidth-small-and-wo"
text = "\uff66\uff67\uff68\uff69\uff6a\uff6b\uff6c\uff6d\uff6e\uff6f"
findings = ["1:1"]
messages = ["半角カナ「\uff66\uff67\uff68\uff69\uff6a\uff6b\uff6c\uff6d\uff6e\uff6f」を全角にする"]
fixed = "ヲァィゥェォャュョッ"

[[cases]]
name = "kn-halfwidth-middle-dot"
text = "\uff7b\uff70\uff8a\uff9e\uff70\uff65\uff78\uff97\uff72\uff71\uff9d\uff84"
findings = ["1:1"]
messages = ["半角カナ「\uff7b\uff70\uff8a\uff9e\uff70\uff65\uff78\uff97\uff72\uff71\uff9d\uff84」を全角にする"]
fixed = "サーバー・クライアント"

[[cases]]
name = "kn-halfwidth-punctuation-is-not-checked"
text = "\uff62半角\uff63\uff64句読点\uff61"
findings = []
fixed = "\uff62半角\uff63\uff64句読点\uff61"

[[cases]]
name = "kn-punctuation-ends-the-run"
text = "\uff61\uff71\uff72\uff62\uff73\uff63\uff64"
findings = ["1:2", "1:5"]
messages = ["半角カナ「\uff71\uff72」を全角にする", "半角カナ「\uff73」を全角にする"]
fixed = "\uff61アイ\uff62ウ\uff63\uff64"

[[cases]]
name = "kn-fullwidth-katakana-is-not-checked"
text = "サーバーとアイウ"
findings = []
fixed = "サーバーとアイウ"

[[cases]]
name = "kn-halfwidth-two-runs"
text = "\uff71\uff72\uff73 と \uff74\uff75 と \uff76"
findings = ["1:1", "1:7", "1:12"]
messages = ["半角カナ「\uff71\uff72\uff73」を全角にする", "半角カナ「\uff74\uff75」を全角にする", "半角カナ「\uff76」を全角にする"]
fixed = "アイウ と エオ と カ"

[[cases]]
name = "kn-dict-basic"
text = "アジヤとイタリヤ"
findings = ["1:1", "1:5"]
messages = ["「アジヤ」を「アジア」にする", "「イタリヤ」を「イタリア」にする"]
fixed = "アジヤとイタリヤ"

[[cases]]
name = "kn-dict-inside-correct-word"
text = "アンティークとアンチーク"
findings = ["1:1", "1:8"]
messages = ["「アンティ」を「アンチ」にする", "「アンチーク」を「アンティーク」にする"]
fixed = "アンティークとアンチーク"

[[cases]]
name = "kn-dict-several-words"
text = "インターフェースとインタフェースとイヴェント"
findings = ["1:1", "1:10", "1:18"]
messages = ["「インターフェース」を「インターフェイス」にする", "「インタフェース」を「インターフェイス」にする", "「イヴェント」を「イベント」にする"]
fixed = "インターフェースとインタフェースとイヴェント"

[[cases]]
name = "kn-dict-and-halfwidth"
text = "イタリヤの\uff71\uff72\uff73"
findings = ["1:1", "1:6"]
messages = ["「イタリヤ」を「イタリア」にする", "半角カナ「\uff71\uff72\uff73」を全角にする"]
fixed = "イタリヤのアイウ"

[[cases]]
name = "kn-dict-in-heading"
text = "# イタリヤ"
findings = ["1:3"]
messages = ["「イタリヤ」を「イタリア」にする"]
fixed = "# イタリヤ"

[[cases]]
name = "kn-dict-in-strong"
text = "**イタリヤ**です"
findings = ["1:3"]
messages = ["「イタリヤ」を「イタリア」にする"]
fixed = "**イタリヤ**です"

[[cases]]
name = "kn-dict-in-table-cell"
text = "| 列 |\n| - |\n| イタリヤ |"
findings = ["3:3"]
messages = ["「イタリヤ」を「イタリア」にする"]
fixed = "| 列 |\n| - |\n| イタリヤ |"

[[cases]]
name = "kn-dict-in-strike"
text = "~~イタリヤ~~"
findings = ["1:3"]
messages = ["「イタリヤ」を「イタリア」にする"]
fixed = "~~イタリヤ~~"

[[cases]]
name = "kn-dict-in-emphasis-is-not-checked"
text = "*イタリヤ*"
findings = []
fixed = "*イタリヤ*"

[[cases]]
name = "kn-dict-in-link-is-not-checked"
text = "[イタリヤ](https://example.com)"
findings = []
fixed = "[イタリヤ](https://example.com)"

[[cases]]
name = "kn-dict-in-quote-is-not-checked"
text = "> イタリヤ"
findings = []
fixed = "> イタリヤ"

[[cases]]
name = "kn-dict-in-list"
text = "- イタリヤ"
findings = ["1:3"]
messages = ["「イタリヤ」を「イタリア」にする"]
fixed = "- イタリヤ"

[[cases]]
name = "kn-dict-in-footnote"
text = "[^1]: イタリヤ"
findings = ["1:7"]
messages = ["「イタリヤ」を「イタリア」にする"]
fixed = "[^1]: イタリヤ"

[[cases]]
name = "kn-dict-in-inline-html"
text = "<span>イタリヤ</span>"
findings = ["1:7"]
messages = ["「イタリヤ」を「イタリア」にする"]
fixed = "<span>イタリヤ</span>"

[[cases]]
name = "kn-dict-in-inline-code-is-not-checked"
text = "`イタリヤ`"
findings = []
fixed = "`イタリヤ`"

[[cases]]
name = "kn-dict-in-image-alt-is-not-checked"
text = "![イタリヤ](a.png)"
findings = []
fixed = "![イタリヤ](a.png)"

[[cases]]
name = "kn-dict-in-shortcut-reference-link"
note = "定義を持つ省略形の参照リンクの文字列は、本文でないので見ない。textlintは見て、指摘する"
text = "[イタリヤ]\n\n[イタリヤ]: https://example.com"
findings = []
fixed = "[イタリヤ]\n\n[イタリヤ]: https://example.com"

[[cases]]
name = "kn-dict-in-collapsed-reference-link"
note = "定義を持つcollapsed形の参照リンクの文字列は、本文でないので見ない。textlintは見て、指摘する"
text = "[イタリヤ][]\n\n[イタリヤ]: https://example.com"
findings = []
fixed = "[イタリヤ][]\n\n[イタリヤ]: https://example.com"

[[cases]]
name = "kn-dict-in-full-reference-link"
text = "[イタリヤ][r]\n\n[r]: https://example.com"
findings = ["1:2"]
messages = ["「イタリヤ」を「イタリア」にする"]
fixed = "[イタリヤ][r]\n\n[r]: https://example.com"

[[cases]]
name = "kn-halfwidth-heading"
text = "# \uff71\uff72\uff73"
findings = []
fixed = "# \uff71\uff72\uff73"

[[cases]]
name = "kn-halfwidth-quote"
text = "> \uff71\uff72\uff73"
findings = []
fixed = "> \uff71\uff72\uff73"

[[cases]]
name = "kn-halfwidth-table"
text = "| 列 |\n| - |\n| \uff71\uff72\uff73 |"
findings = []
fixed = "| 列 |\n| - |\n| \uff71\uff72\uff73 |"

[[cases]]
name = "kn-halfwidth-list"
text = "- \uff71\uff72\uff73"
findings = ["1:3"]
messages = ["半角カナ「\uff71\uff72\uff73」を全角にする"]
fixed = "- アイウ"

[[cases]]
name = "kn-halfwidth-link"
text = "[\uff71\uff72\uff73](https://example.com)"
findings = []
fixed = "[\uff71\uff72\uff73](https://example.com)"

[[cases]]
name = "kn-halfwidth-strong"
text = "**\uff71\uff72\uff73**"
findings = []
fixed = "**\uff71\uff72\uff73**"

[[cases]]
name = "kn-halfwidth-emphasis"
text = "*\uff71\uff72\uff73*"
findings = []
fixed = "*\uff71\uff72\uff73*"

[[cases]]
name = "kn-halfwidth-strike"
text = "~~\uff71\uff72\uff73~~"
findings = []
fixed = "~~\uff71\uff72\uff73~~"

[[cases]]
name = "kn-halfwidth-code"
text = "`\uff71\uff72\uff73`"
findings = []
fixed = "`\uff71\uff72\uff73`"

[[cases]]
name = "kn-halfwidth-footnote"
text = "[^1]: \uff71\uff72\uff73"
findings = ["1:7"]
messages = ["半角カナ「\uff71\uff72\uff73」を全角にする"]
fixed = "[^1]: アイウ"

[[cases]]
name = "kn-halfwidth-html"
text = "<span>\uff71\uff72\uff73</span>"
findings = ["1:7"]
messages = ["半角カナ「\uff71\uff72\uff73」を全角にする"]
fixed = "<span>アイウ</span>"

[[cases]]
name = "kn-overlaps-no-hankaku-kana"
note = "`no-hankaku-kana` が有効なら、同じ範囲の箇所はルールの一覧で前にある `no-hankaku-kana` の箇所が残り、`2.1.5` の箇所は出ない。結果は `no-hankaku-kana` のNFKCで、全角カナになる。辞書の部分の指摘は残る"
builtin = '''
"2.1.5.カタカナ" = true
'''
text = "\uff71\uff72\uff73とイタリヤ"
findings = ["1:5"]
messages = ["「イタリヤ」を「イタリア」にする"]
fixed = "アイウとイタリヤ"

[[cases]]
name = "kn-overlaps-no-hankaku-kana-longer-run"
note = "`no-hankaku-kana` の続きは U+FF61 から始まり、`2.1.5` の続きより長い。先に始まる `no-hankaku-kana` の箇所が残り、`2.1.5` の箇所は出ない"
builtin = '''
"2.1.5.カタカナ" = true
'''
text = "\uff61\uff71\uff72\uff62\uff73\uff63\uff64"
findings = []
fixed = "。アイ「ウ」、"

[[cases]]
name = "kn-repeats-with-3-1-2"
note = "`2.1.5` が `\uff7b` を `サ` にした後、`3.1.2` が `と サ` の空白に当たる。1回の `jafix fix` で、2つの修正が続けて当たる"
builtin = '''
"2.1.5.カタカナ" = true
"3.1.2.全角文字どうし" = true
no-hankaku-kana = false
'''
text = "と \uff7b"
findings = ["1:3"]
messages = ["半角カナ「\uff7b」を全角にする"]
fixed = "とサ"

[[cases]]
name = "kn-dict-does-not-fix"
note = "辞書の部分は直さず指摘にする。textlintの `--fix` は `アンチ` にする。半角カナの部分だけを直す"
text = "アンティと\uff71\uff72\uff73"
findings = ["1:1", "1:6"]
messages = ["「アンティ」を「アンチ」にする", "半角カナ「\uff71\uff72\uff73」を全角にする"]
fixed = "アンティとアイウ"
