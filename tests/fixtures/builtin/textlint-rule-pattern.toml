findings = ["1:4", "3:37", "3:48", "3:59", "7:7", "9:5", "11:5", "13:7", "15:5"]
messages = ["「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない"]
fixed = "段落のTODO\n\n[リンクのTODO](http://example.com/)と*強調のTODO*と**太字のTODO**と~~消すTODO~~\n\n> 引用のTODO\n\n# 見出しのTODO\n\n| 表のTODO |\n| --- |\n| 表のTODO |\n\n- リストのTODO\n\n[参照のTODO][a]\n\n[a]: http://example.com/"

[[cases]]
name = "a-allow-node-types-with-replace"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'TODOを残さない'
pattern = 'TODO'
replace = 'DONE'
allowNodeTypes = ['BlockQuote']
'''
text = "> 引用のTODO\n\nTODO"
findings = ["3:1"]
messages = ["「TODO」: TODOを残さない"]
fixed = "> 引用のTODO\n\nDONE"

[[cases]]
name = "a-allow-node-types-keeps-other-elements"
note = "allowNodeTypes は、当たった要素の、そのnodeの中の箇所だけを除く。textlintは、そのnodeの以降の箇所と以降の要素も調べないので、引用の中の `TODO` を指摘しない"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = '日付を書かない'
pattern = '/\d{4}\/\d{2}\/\d{2}/'
allowNodeTypes = ['BlockQuote']
[[builtin."@textlint-rule/pattern".patterns]]
message = 'TODOを残さない'
pattern = 'TODO'
'''
text = "> 2000/01/01 TODOとTODO\n\nTODOと2000/01/01"
findings = ["1:14", "1:19", "3:1", "3:6"]
messages = ["「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「2000/01/01」: 日付を書かない"]
fixed = "> 2000/01/01 TODOとTODO\n\nTODOと2000/01/01"

[[cases]]
name = "o-replace-starts-earlier"
note = "重なる箇所は、先に始まる箇所を残す。textlintは、`abc` と `cde` の両方を指摘し、直すのは後ろで終わる `cde` である"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'A'
pattern = 'abc'
replace = '1'
[[builtin."@textlint-rule/pattern".patterns]]
message = 'B'
pattern = 'cde'
replace = '2'
'''
text = "abcdef"
findings = ["1:1"]
messages = ["「abc」: A"]
fixed = "1def"

[[cases]]
name = "o-replace-longer-at-same-start"
note = "同じ位置で始まる箇所は、長い箇所を残す"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'A'
pattern = 'ab'
replace = '1'
[[builtin."@textlint-rule/pattern".patterns]]
message = 'B'
pattern = 'abcd'
replace = '2'
'''
text = "abcdef"
findings = ["1:1"]
messages = ["「abcd」: B"]
fixed = "2ef"

[[cases]]
name = "o-replace-earlier-element-at-same-range"
note = "範囲が同じ箇所は、前にある要素の箇所を残す"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'A'
pattern = 'abc'
replace = '1'
[[builtin."@textlint-rule/pattern".patterns]]
message = 'B'
pattern = '/ab./'
replace = '2'
'''
text = "abc"
findings = ["1:1"]
messages = ["「abc」: A"]
fixed = "1"

[[cases]]
name = "o-replace-three-elements"
note = "同じ位置で始まる `abc` と `abcd` は長い `abcd` を残し、`abcd` と重なる `cde` も直さない"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'A'
pattern = 'abc'
replace = '1'
[[builtin."@textlint-rule/pattern".patterns]]
message = 'B'
pattern = 'cde'
replace = '2'
[[builtin."@textlint-rule/pattern".patterns]]
message = 'C'
pattern = 'abcd'
replace = '3'
'''
text = "abcdef"
findings = ["1:1"]
messages = ["「abcd」: C"]
fixed = "3ef"

[[cases]]
name = "o-replace-compares-with-kept"
note = "残した箇所の終わりと、次の箇所の始まりを比べる。捨てた `cdef` ではなく `abcd` と比べるので、`abcd` の直後から始まる `efgh` は残る"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'A'
pattern = 'abcd'
replace = '1'
[[builtin."@textlint-rule/pattern".patterns]]
message = 'B'
pattern = 'cdef'
replace = '2'
[[builtin."@textlint-rule/pattern".patterns]]
message = 'C'
pattern = 'efgh'
replace = '3'
'''
text = "abcdefgh"
findings = ["1:1", "1:5"]
messages = ["「abcd」: A", "「efgh」: C"]
fixed = "13"

[[cases]]
name = "o-report-elements-all"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'A'
pattern = 'abc'
[[builtin."@textlint-rule/pattern".patterns]]
message = 'B'
pattern = 'cde'
'''
text = "abcdef"
findings = ["1:1", "1:3"]
messages = ["「abc」: A", "「cde」: B"]
fixed = "abcdef"

[[cases]]
name = "o-report-element-overlapping-replace"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'A'
pattern = 'abc'
replace = '1'
[[builtin."@textlint-rule/pattern".patterns]]
message = 'B'
pattern = 'cde'
'''
text = "abcdef"
findings = ["1:1", "1:3"]
messages = ["「abc」: A", "「cde」: B"]
fixed = "1def"

[[cases]]
name = "m-colon-in-message"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = '注意: TODOを残さない'
pattern = 'TODO'
'''
text = "TODO"
findings = ["1:1"]
messages = ["「TODO」: 注意: TODOを残さない"]
fixed = "TODO"

[[cases]]
name = "m-newline-in-message"
note = "文面に埋め込む文字列の中の改行は、`\\n` の2文字にする。出力は1件1行である"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = "TODOを残さない\n理由を書く"
pattern = 'TODO'
'''
text = "TODO"
findings = ["1:1"]
messages = ["「TODO」: TODOを残さない\\n理由を書く"]
fixed = "TODO"

[[cases]]
name = "x-builtin-fix-after-replacement"
note = "利用者の置き換えを先に当て、その結果に組み込みの修正ルールを当てる。置き換えが残した日本語と英数字の間の空白は、同じ実行で消える"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'm'
pattern = '/(本語) (A)BC/'
replace = '$1 $2bc'
'''
text = "日本語 ABC"
findings = ["1:2"]
messages = ["「本語 ABC」: m"]
fixed = "日本語Abc"

[[cases]]
name = "x-replacement-undone-by-builtin-fix"
note = "置き換えの固定の部分は空白だけで、境目は判定しない。置き換えが作った日本語と英数字の間の空白は、組み込みの修正ルールが消すので、置き換えは効かない"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'm'
pattern = '/(語)(ABC)/'
replace = '$1 $2'
'''
text = "日本語ABC"
findings = ["1:3"]
messages = ["「語ABC」: m"]
fixed = "日本語ABC"

[[cases]]
name = "x-fullwidth-paren-disabled"
builtin = '''
fullwidth-paren = false
[[builtin."@textlint-rule/pattern".patterns]]
message = '全角にする'
pattern = '/\((.+?)\)/'
replace = '（$1）'
'''
text = "いいね(笑)ね"
findings = ["1:4"]
messages = ["「(笑)」: 全角にする"]
fixed = "いいね（笑）ね"

[[cases]]
name = "x-prh-same-range"
note = "prhと `@textlint-rule/pattern` の箇所の範囲が同じなら、prhの箇所を残し、patternの箇所は直さない"
builtin = '''
[builtin.prh]
ruleContents = [
"""
rules:
  - expected: Cookie
    pattern: クッキー
""",
]
[[builtin."@textlint-rule/pattern".patterns]]
message = 'ビスケットと書く'
pattern = 'クッキー'
replace = 'Biscuit'
'''
text = "クッキー"
findings = []
fixed = "Cookie"

[[cases]]
name = "x-pattern-starts-before-prh"
note = "重なる箇所は、先に始まる箇所を残す。patternの箇所が先に始まるので、prhの箇所は直さない"
builtin = '''
[builtin.prh]
ruleContents = [
"""
rules:
  - expected: P
    pattern: cdef
""",
]
[[builtin."@textlint-rule/pattern".patterns]]
message = 'm'
pattern = 'abcd'
replace = 'Q'
'''
text = "abcdef"
findings = ["1:1"]
messages = ["「abcd」: m"]
fixed = "Qef"

[[cases]]
name = "x-prh-starts-before-pattern"
note = "重なる箇所は、先に始まる箇所を残す。prhの箇所が先に始まるので、patternの箇所は直さない"
builtin = '''
[builtin.prh]
ruleContents = [
"""
rules:
  - expected: P
    pattern: abcd
""",
]
[[builtin."@textlint-rule/pattern".patterns]]
message = 'm'
pattern = 'cdef'
replace = 'Q'
'''
text = "abcdef"
findings = []
fixed = "Pef"

[[cases]]
name = "x-pattern-longer-at-same-start"
note = "同じ位置で始まる箇所は、長い箇所を残す。patternの箇所が長いので、prhの箇所は直さない"
builtin = '''
[builtin.prh]
ruleContents = [
"""
rules:
  - expected: P
    pattern: ab
""",
]
[[builtin."@textlint-rule/pattern".patterns]]
message = 'm'
pattern = 'abcd'
replace = 'Q'
'''
text = "abcdef"
findings = ["1:1"]
messages = ["「abcd」: m"]
fixed = "Qef"

[[cases]]
name = "x-prh-and-pattern-apart"
note = "重ならない箇所は、prhと `@textlint-rule/pattern` のどちらも直す"
builtin = '''
[builtin.prh]
ruleContents = [
"""
rules:
  - expected: Cookie
    pattern: クッキー
""",
]
[[builtin."@textlint-rule/pattern".patterns]]
message = 'TODOを残さない'
pattern = 'TODO'
replace = 'DONE'
'''
text = "クッキーとTODO"
findings = ["1:6"]
messages = ["「TODO」: TODOを残さない"]
fixed = "CookieとDONE"
