# @textlint-rule/pattern の例。期待値は、textlint 15.8.0、@textlint-rule/textlint-rule-pattern 2.0.2 (@textlint/regexp-string-matcher 2.0.2) の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所で、期待値はjafixの規則から決めた。
#
# rule:     指摘の行の `[<rule-id>]` に出るルールのID。ファイル名と違うので書く (省略するとファイル名)
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表の下に書く内容。辞書とパターンがcaseごとに違うので、すべてのcaseが持つ
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘と箇所の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    `jafix fix` の後の内容から、末尾の改行を除いたもの。2回目の `jafix fix` で変わらないことも確かめる

rule = "@textlint-rule/pattern"

[[cases]]
name = "p-string-literal"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'TODOを残さない'
pattern = 'TODO'
'''
text = "TODOとtodoとTODO"
findings = ["1:1", "1:11"]
messages = ["「TODO」: TODOを残さない", "「TODO」: TODOを残さない"]
fixed = "TODOとtodoとTODO"

[[cases]]
name = "p-string-with-regex-characters"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'm1'
pattern = 'C++'
[[builtin."@textlint-rule/pattern".patterns]]
message = 'm2'
pattern = '(a)'
'''
text = "C++とc++と(a)とa"
findings = ["1:1", "1:9"]
messages = ["「C++」: m1", "「(a)」: m2"]
fixed = "C++とc++と(a)とa"

[[cases]]
name = "p-string-double-slash"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'スラッシュ'
pattern = '//'
'''
text = "a//bと//"
findings = ["1:2", "1:6"]
messages = ["「//」: スラッシュ", "「//」: スラッシュ"]
fixed = "a//bと//"

[[cases]]
name = "p-string-slash-prefixed"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'パス'
pattern = '/path/to'
'''
text = "/path/toとpath/to"
findings = ["1:1"]
messages = ["「/path/to」: パス"]
fixed = "/path/toとpath/to"

[[cases]]
name = "p-regex"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'TODOを残さない'
pattern = '/TODO:/i'
'''
text = "TODO:とtodo:とTODO"
findings = ["1:1", "1:7"]
messages = ["「TODO:」: TODOを残さない", "「todo:」: TODOを残さない"]
fixed = "TODO:とtodo:とTODO"

[[cases]]
name = "p-regex-anchor-without-m"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'm'
pattern = '/^foo/'
'''
text = "x\nfoo"
findings = []
fixed = "x\nfoo"

[[cases]]
name = "p-flag-m"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'm'
pattern = '/^foo/m'
'''
text = "x\nfoo\nbar\nfoo"
findings = ["2:1", "4:1"]
messages = ["「foo」: m", "「foo」: m"]
fixed = "x\nfoo\nbar\nfoo"

[[cases]]
name = "p-flag-s"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = '改行をまたぐ'
pattern = '/a.b/s'
'''
text = "a\nbとa\nb"
findings = ["1:1", "2:3"]
messages = ["「a\\nb」: 改行をまたぐ", "「a\\nb」: 改行をまたぐ"]
fixed = "a\nbとa\nb"

[[cases]]
name = "p-dot-without-s"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = '改行をまたぐ'
pattern = '/a.b/'
'''
text = "a\nb"
findings = []
fixed = "a\nb"

[[cases]]
name = "p-flags-d-g-u"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'a'
pattern = '/a/dgu'
'''
text = "abaとa"
findings = ["1:1", "1:3", "1:5"]
messages = ["「a」: a", "「a」: a", "「a」: a"]
fixed = "abaとa"

[[cases]]
name = "p-regex-lookbehind"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'm'
pattern = '/(?<=a)X(?=b)/'
'''
text = "aXbとcXb"
findings = ["1:2"]
messages = ["「X」: m"]
fixed = "aXbとcXb"

[[cases]]
name = "p-regex-backreference"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = '重複'
pattern = '/(\w)\1/'
'''
text = "aaとab"
findings = ["1:1"]
messages = ["「aa」: 重複"]
fixed = "aaとab"

[[cases]]
name = "p-regex-named-group"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'm'
pattern = '/(?<y>\d{4})-(?<m>\d{2})/'
replace = '$1/$2'
'''
text = "2020-01と2021-02"
findings = ["1:1", "1:9"]
messages = ["「2020-01」: m", "「2021-02」: m"]
fixed = "2020/01と2021/02"

[[cases]]
name = "p-regex-script-han"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = '漢字2文字以上'
pattern = '/\p{Script=Han}{2,}/'
'''
text = "漢字とかんじと漢"
findings = ["1:1"]
messages = ["「漢字」: 漢字2文字以上"]
fixed = "漢字とかんじと漢"

[[cases]]
name = "p-regex-ascii-word-boundary"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'IDと書く'
pattern = '/\bid\b/i'
replace = 'ID'
'''
text = "ユーザーidを確認"
findings = ["1:5"]
messages = ["「id」: IDと書く"]
fixed = "ユーザーIDを確認"

[[cases]]
name = "p-regex-ascii-digit"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = '数字'
pattern = '/\d+/'
'''
text = "１２３と456"
findings = ["1:5"]
messages = ["「456」: 数字"]
fixed = "１２３と456"

[[cases]]
name = "p-two-elements-in-position-order"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'TODOを残さない'
pattern = 'TODO'
[[builtin."@textlint-rule/pattern".patterns]]
message = 'FIXMEを残さない'
pattern = 'FIXME'
'''
text = "FIXMEとTODO"
findings = ["1:1", "1:7"]
messages = ["「FIXME」: FIXMEを残さない", "「TODO」: TODOを残さない"]
fixed = "FIXMEとTODO"

[[cases]]
name = "p-replace-date"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = '日付はYYYY-MM-DDで書く'
pattern = '/(\d{4})\/(\d{2})\/(\d{2})/'
replace = '$1-$2-$3'
'''
text = "2020/01/02と2021/12/31"
findings = ["1:1", "1:12"]
messages = ["「2020/01/02」: 日付はYYYY-MM-DDで書く", "「2021/12/31」: 日付はYYYY-MM-DDで書く"]
fixed = "2020-01-02と2021-12-31"

[[cases]]
name = "p-replace-references"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'm'
pattern = '/(?:(a)|(b))z/'
replace = '[$1|$2|$0|$3|$10]'
'''
text = "azとbz"
findings = ["1:1", "1:4"]
messages = ["「az」: m", "「bz」: m"]
fixed = "[a|$2|$0|$3|a0]と[$1|b|$0|$3|$10]"

[[cases]]
name = "p-replace-empty"
note = "`replace = \"\"` は、一致した文字列を消す修正にする。textlintは空文字列を偽とみなし、指摘だけを出す"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'fooを消す'
pattern = 'foo'
replace = ''
'''
text = "削除対象fooです"
findings = ["1:5"]
messages = ["「foo」: fooを消す"]
fixed = "削除対象です"

[[cases]]
name = "p-replace-same-as-match"
note = "置き換え後が一致した文字列と同じ一致は、箇所にしない。textlintは、直しても変わらない箇所も指摘する"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'm'
pattern = '/(foo)bar/'
replace = '$1bar'
'''
text = "foobar"
findings = []
fixed = "foobar"

[[cases]]
name = "p-replace-heading"
note = "見出しの中の箇所は、直さずに指摘にする。見出しのアンカーが変わり、見出しへのリンクが切れるため"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'TODOを残さない'
pattern = 'TODO'
replace = 'ToDo'
'''
text = "# TODOの話\n\nTODO"
findings = ["1:3", "3:1"]
messages = ["「TODO」: TODOを残さない。見出しのアンカーが変わるので、見出しへのリンクも直す", "「TODO」: TODOを残さない"]
fixed = "# TODOの話\n\nToDo"

[[cases]]
name = "p-replace-setext-heading"
note = "setext形式の見出しも、直さずに指摘にする"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'TODOを残さない'
pattern = 'TODO'
replace = 'ToDo'
'''
text = "TODOの話\n=======\n\nTODO"
findings = ["1:1", "4:1"]
messages = ["「TODO」: TODOを残さない。見出しのアンカーが変わるので、見出しへのリンクも直す", "「TODO」: TODOを残さない"]
fixed = "TODOの話\n=======\n\nToDo"

[[cases]]
name = "p-replace-newline-in-match"
note = "一致した文字列が改行を含む箇所は、直さずに指摘にする。hookは、直した後の行の番号が変わらないことを前提にする"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'つなげる'
pattern = '/foo\s+bar/'
replace = 'FOOBAR'
'''
text = "foo\nbar"
findings = ["1:1"]
messages = ["「foo\\nbar」: つなげる。改行を含むので直さない"]
fixed = "foo\nbar"

[[cases]]
name = "p-replace-newline-in-replacement"
note = "置き換え後の文字列が改行を含む箇所は、直さずに指摘にする"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = '分ける'
pattern = 'foo'
replace = "FOO\nBAR"
'''
text = "foo"
findings = ["1:1"]
messages = ["「foo」: 分ける。改行を含むので直さない"]
fixed = "foo"

[[cases]]
name = "p-replace-heading-newline"
note = "見出しの中で改行を含む箇所は、見出しの文面だけを続ける。どちらも直さずに指摘にする"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'つなげる'
pattern = '/foo\s+bar/'
replace = 'FOOBAR'
'''
text = "foo\nbar\n===\n\nfoo\nbar"
findings = ["1:1", "5:1"]
messages = ["「foo\\nbar」: つなげる。見出しのアンカーが変わるので、見出しへのリンクも直す", "「foo\\nbar」: つなげる。改行を含むので直さない"]
fixed = "foo\nbar\n===\n\nfoo\nbar"

[[cases]]
name = "p-no-replace-newline-in-match"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'つなげない'
pattern = '/foo\s+bar/'
'''
text = "foo\nbar"
findings = ["1:1"]
messages = ["「foo\\nbar」: つなげない"]
fixed = "foo\nbar"

[[cases]]
name = "p-replace-zero-length"
note = "長さ0の一致は箇所にしない。textlintは `range must not be same` で止まる"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'm'
pattern = '/(?<=a)(?=b)/'
replace = '-'
'''
text = "ab"
findings = []
fixed = "ab"

[[cases]]
name = "p-no-replace-zero-length"
note = "長さ0の一致は箇所にしない。textlintは `range must not be same` で止まる"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'm'
pattern = '/(?<=a)(?=b)/'
'''
text = "ab"
findings = []
fixed = "ab"

[[cases]]
name = "p-replace-multiple-elements"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'm1'
pattern = 'TODO'
replace = 'DONE'
[[builtin."@textlint-rule/pattern".patterns]]
message = 'm2'
pattern = 'FIXME'
replace = 'FIXED'
[[builtin."@textlint-rule/pattern".patterns]]
message = 'm3'
pattern = '/(\d{4})\/(\d{2})\/(\d{2})/'
replace = '$1-$2-$3'
'''
text = "TODOとFIXMEと2020/01/02"
findings = ["1:1", "1:6", "1:12"]
messages = ["「TODO」: m1", "「FIXME」: m2", "「2020/01/02」: m3"]
fixed = "DONEとFIXEDと2020-01-02"

[[cases]]
name = "p-replace-and-report-elements"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = '置き換える'
pattern = 'TODO'
replace = 'DONE'
[[builtin."@textlint-rule/pattern".patterns]]
message = '指摘だけ'
pattern = 'FIXME'
'''
text = "TODOとFIXME"
findings = ["1:1", "1:6"]
messages = ["「TODO」: 置き換える", "「FIXME」: 指摘だけ"]
fixed = "DONEとFIXME"

[[cases]]
name = "p-allows-string-and-regex"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'fooを使わない'
pattern = '/foo(-\w+)?/'
allows = ['foo-ok', '/^foo$/']
'''
text = "foo-okとfoo-ngとfoo"
findings = ["1:8"]
messages = ["「foo-ng」: fooを使わない"]
fixed = "foo-okとfoo-ngとfoo"

[[cases]]
name = "p-allows-sees-only-the-match"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'TODOを残さない'
pattern = 'TODO'
allows = ['/^TODO:/']
'''
text = "TODO: aとTODO"
findings = ["1:1", "1:9"]
messages = ["「TODO」: TODOを残さない", "「TODO」: TODOを残さない"]
fixed = "TODO: aとTODO"

[[cases]]
name = "p-allows-with-replace"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = '日付はYYYY-MM-DDで書く'
pattern = '/(\d{4})\/(\d{2})\/(\d{2})/'
replace = '$1-$2-$3'
allows = ['/1000/01/01/']
'''
text = "2020/01/02と1000/01/01"
findings = ["1:1"]
messages = ["「2020/01/02」: 日付はYYYY-MM-DDで書く"]
fixed = "2020-01-02と1000/01/01"

[[cases]]
name = "c-structures"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'TODOを残さない'
pattern = 'TODO'
'''
text = "段落のTODO\n\n[リンクのTODO](http://example.com/)と*強調のTODO*と**太字のTODO**と~~消すTODO~~\n\n> 引用のTODO\n\n# 見出しのTODO\n\n| 表のTODO |\n| --- |\n| 表のTODO |\n\n- リストのTODO\n\n[参照のTODO][a]\n\n[a]: http://example.com/"
findings = ["1:4", "3:6", "3:37", "3:48", "3:59", "5:6", "7:7", "9:5", "11:5", "13:7", "15:5"]
messages = ["「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない"]
fixed = "段落のTODO\n\n[リンクのTODO](http://example.com/)と*強調のTODO*と**太字のTODO**と~~消すTODO~~\n\n> 引用のTODO\n\n# 見出しのTODO\n\n| 表のTODO |\n| --- |\n| 表のTODO |\n\n- リストのTODO\n\n[参照のTODO][a]\n\n[a]: http://example.com/"

[[cases]]
name = "c-replace-in-structures"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'TODOを残さない'
pattern = 'TODO'
replace = 'DONE'
'''
text = "段落のTODO\n\n[リンクのTODO](http://example.com/)と*強調のTODO*と**太字のTODO**と~~消すTODO~~\n\n> 引用のTODO\n\n# 見出し\n\n| 表のTODO |\n| --- |\n| 表のTODO |\n\n- リストのTODO\n\n[参照のTODO][a]\n\n[a]: http://example.com/"
findings = ["1:4", "3:6", "3:37", "3:48", "3:59", "5:6", "9:5", "11:5", "13:7", "15:5"]
messages = ["「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない", "「TODO」: TODOを残さない"]
fixed = "段落のDONE\n\n[リンクのDONE](http://example.com/)と*強調のDONE*と**太字のDONE**と~~消すDONE~~\n\n> 引用のDONE\n\n# 見出し\n\n| 表のDONE |\n| --- |\n| 表のDONE |\n\n- リストのDONE\n\n[参照のDONE][a]\n\n[a]: http://example.com/"

[[cases]]
name = "c-multi-line-paragraph"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'TODOを残さない'
pattern = 'TODO'
'''
text = "一行目\nTODOの二行目"
findings = ["2:1"]
messages = ["「TODO」: TODOを残さない"]
fixed = "一行目\nTODOの二行目"

[[cases]]
name = "c-reference-full"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'TODOを残さない'
pattern = 'TODO'
'''
text = "[参照のTODO][a]とTODO\n\n[a]: http://example.com/"
findings = ["1:5", "1:14"]
messages = ["「TODO」: TODOを残さない", "「TODO」: TODOを残さない"]
fixed = "[参照のTODO][a]とTODO\n\n[a]: http://example.com/"

[[cases]]
name = "c-reference-shortcut"
note = "定義を持つ省略形の参照リンクの文字列は、定義のラベルを兼ねるので本文にしない。textlintは `[省略のTODO]` の中も指摘する"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'TODOを残さない'
pattern = 'TODO'
'''
text = "[省略のTODO]とTODO\n\n[省略のTODO]: http://example.com/"
findings = ["1:11"]
messages = ["「TODO」: TODOを残さない"]
fixed = "[省略のTODO]とTODO\n\n[省略のTODO]: http://example.com/"

[[cases]]
name = "c-reference-collapsed"
note = "collapsed形の参照リンクの文字列も、定義のラベルを兼ねるので本文にしない"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'TODOを残さない'
pattern = 'TODO'
'''
text = "[省略のTODO][]とTODO\n\n[省略のTODO]: http://example.com/"
findings = ["1:13"]
messages = ["「TODO」: TODOを残さない"]
fixed = "[省略のTODO][]とTODO\n\n[省略のTODO]: http://example.com/"

[[cases]]
name = "c-brackets-without-definition"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'TODOを残さない'
pattern = 'TODO'
'''
text = "[省略のTODO]とTODO"
findings = ["1:5", "1:11"]
messages = ["「TODO」: TODOを残さない", "「TODO」: TODOを残さない"]
fixed = "[省略のTODO]とTODO"

[[cases]]
name = "c-bare-url"
note = "裸のURLは本文にしない。textlintは、URLの中の文字列も指摘する"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'TODOを残さない'
pattern = 'TODO'
'''
text = "http://example.com/TODO とTODO"
findings = ["1:26"]
messages = ["「TODO」: TODOを残さない"]
fixed = "http://example.com/TODO とTODO"

[[cases]]
name = "c-autolink"
note = "自動リンクは本文にしない。textlintは、URLの中の文字列も指摘する"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'TODOを残さない'
pattern = 'TODO'
'''
text = "<http://example.com/TODO>とTODO"
findings = ["1:27"]
messages = ["「TODO」: TODOを残さない"]
fixed = "<http://example.com/TODO>とTODO"

[[cases]]
name = "c-inline-code"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'TODOを残さない'
pattern = 'TODO'
'''
text = "`TODO`とTODO"
findings = ["1:8"]
messages = ["「TODO」: TODOを残さない"]
fixed = "`TODO`とTODO"

[[cases]]
name = "c-code-block"
builtin = '''
[[builtin."@textlint-rule/pattern".patterns]]
message = 'TODOを残さない'
pattern = 'TODO'
'''
text = "```\nTODO\n```\n\n    TODO\n\nTODO"
findings = ["7:1"]
messages = ["「TODO」: TODOを残さない"]
