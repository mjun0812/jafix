findings = ["3:6"]
messages = ["図表のキャプションを敬体(ですます調)に揃える: 「ないか。」は常体"]

[[cases]]
name = "ic-all-end-forms-per-alt"
note = "altの文末の形をすべて数える。textlintは1行に1件だけ数えるので、敬体の `です。` を指摘する。jafixは敬体2件と常体2件で同数なので、常体の2件を指摘する"
text = "![図です。それも図です。](i0.png)\n![図だ。](i1.png)\n![図だ。](i2.png)"
