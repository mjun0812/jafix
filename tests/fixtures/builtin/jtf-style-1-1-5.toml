# 1.1.5.図表のキャプション の例。期待値は、textlint 15.8.0 と textlint-rule-preset-jtf-style 3.0.3 の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所か、既存の修正ルールと組み合わさる箇所で、期待値は設計の規則から決めた。
#
# rule:     指摘の行の `[<rule-id>]` のID (fixtureのファイル名はIDを使えないので、ここに書く)
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を全caseに当て、caseに書けばそちらだけを使う
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘と箇所の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    修正ルールだけが持つ。`jafix fix` の後の内容から、末尾の改行を除いたもの。2回目の `jafix fix` で変わらないことも確かめる

rule = "1.1.5.図表のキャプション"
builtin = '''
"1.1.5.図表のキャプション" = true
'''

[[cases]]
name = "ic-tie-flags-dearu"
text = "![図です。](i0.png)\n![図だ。](i1.png)"
findings = ["2:4"]
messages = ["図表のキャプションを敬体(ですます調)に揃える: 「だ。」は常体"]

[[cases]]
name = "ic-desumasu-major"
text = "![図です。](i0.png)\n![図です。](i1.png)\n![図です。](i2.png)\n![図だ。](i3.png)"
findings = ["4:4"]
messages = ["図表のキャプションを敬体(ですます調)に揃える: 「だ。」は常体"]

[[cases]]
name = "ic-dearu-major"
text = "![図だ。](i0.png)\n![図だ。](i1.png)\n![図です。](i2.png)"
findings = ["3:4"]
messages = ["図表のキャプションを常体(である調)に揃える: 「です。」は敬体"]

[[cases]]
name = "ic-only-desumasu"
text = "![図です。](i0.png)\n![図です。](i1.png)"
findings = []

[[cases]]
name = "ic-only-dearu"
text = "![図だ。](i0.png)\n![図だ。](i1.png)"
findings = []

