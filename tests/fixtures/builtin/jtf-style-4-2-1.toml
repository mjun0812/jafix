# 4.2.1.感嘆符(！) の例。期待値は、textlint 15.8.0 と textlint-rule-preset-jtf-style 3.0.3 の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所か、既存の修正ルールと組み合わさる箇所で、期待値は設計の規則から決めた。
#
# rule:     指摘の行の `[<rule-id>]` のID (fixtureのファイル名はIDを使えないので、ここに書く)
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を全caseに当て、caseに書けばそちらだけを使う
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘と箇所の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    修正ルールだけが持つ。`jafix fix` の後の内容から、末尾の改行を除いたもの。2回目の `jafix fix` で変わらないことも確かめる

rule = "4.2.1.感嘆符(！)"
builtin = '''
"4.2.1.感嘆符(！)" = true
'''

[[cases]]
name = "ex-halfwidth"
text = "すごい!"
findings = ["1:4"]
messages = ["感嘆符は全角の「！」にする"]

[[cases]]
name = "ex-halfwidth-before-text"
text = "すごい!日本語!"
findings = ["1:4", "1:8"]
messages = ["感嘆符は全角の「！」にする", "感嘆符は全角の「！」にする"]

[[cases]]
name = "ex-halfwidth-after-english"
text = "Wow! 次"
findings = []

[[cases]]
name = "ex-halfwidth-after-digit"
text = "123!です"
findings = []

[[cases]]
name = "ex-halfwidth-after-hiragana-katakana"
text = "ひらがな!とカタカナ!"
findings = ["1:5", "1:11"]
messages = ["感嘆符は全角の「！」にする", "感嘆符は全角の「！」にする"]

[[cases]]
name = "ex-repetition-mark-is-not-japanese"
text = "人々!と〇!"
findings = []

[[cases]]
name = "ex-long-vowel-is-not-japanese"
text = "サーバー!"
findings = []

[[cases]]
name = "ex-surrogate-pair-kanji"
text = "\U00020bb7!"
findings = ["1:2"]
messages = ["感嘆符は全角の「！」にする"]

[[cases]]
name = "ex-fullwidth-is-allowed"
text = "すごい！"
findings = []

[[cases]]
name = "ex-space-after-fullwidth"
text = "すごい！ 次の文"
findings = ["1:5"]
messages = ["文末の「！」の後に別の文が続くので、直後の半角空白を全角空白にする"]

[[cases]]
name = "ex-space-after-fullwidth-english"
text = "Wow！ Next"
findings = ["1:5"]
messages = ["文末の「！」の後に別の文が続くので、直後の半角空白を全角空白にする"]

[[cases]]
name = "ex-fullwidth-space-after-fullwidth-is-allowed"
