findings = ["1:5"]
messages = ["文末の「！」の後に別の文が続くので、直後の半角空白を全角空白にする"]

[[cases]]
name = "ex-space-then-bracket"
text = "あ！ 「い」"
findings = ["1:3"]
messages = ["文末の「！」の後に別の文が続くので、直後の半角空白を全角空白にする"]

[[cases]]
name = "ex-halfwidth-and-space"
text = "すごい!と驚いた！ 次の文"
findings = ["1:4", "1:10"]
messages = ["感嘆符は全角の「！」にする", "文末の「！」の後に別の文が続くので、直後の半角空白を全角空白にする"]

[[cases]]
name = "ex-space-after-halfwidth-is-not-checked"
text = "すごい! 次の文"
findings = ["1:4"]
messages = ["感嘆符は全角の「！」にする"]

[[cases]]
name = "ex-every-fullwidth-with-space"
note = "前後の文字で判定するので、すべての `！` の後の空白を指摘する。textlintは一致を重ねずに探すので、`！ ！` の2つ目の `！` の後の空白を見落とす"
text = "あ！ ！ これ"
findings = ["1:3", "1:5"]
messages = ["文末の「！」の後に別の文が続くので、直後の半角空白を全角空白にする", "文末の「！」の後に別の文が続くので、直後の半角空白を全角空白にする"]

[[cases]]
name = "ex-every-fullwidth-with-space-in-sentences"
note = "すべての `！` の後の空白を指摘する。textlintは `！ ！` の2つ目の `！` の後の空白だけを見落とす"
text = "すごい！ 次の文。あ！ ！ い！ う"
findings = ["1:5", "1:12", "1:14", "1:17"]
messages = ["文末の「！」の後に別の文が続くので、直後の半角空白を全角空白にする", "文末の「！」の後に別の文が続くので、直後の半角空白を全角空白にする", "文末の「！」の後に別の文が続くので、直後の半角空白を全角空白にする", "文末の「！」の後に別の文が続くので、直後の半角空白を全角空白にする"]

[[cases]]
name = "ex-two-lines"
text = "すごい!\nすごい！ 次"
findings = ["1:4", "2:5"]
messages = ["感嘆符は全角の「！」にする", "文末の「！」の後に別の文が続くので、直後の半角空白を全角空白にする"]

[[cases]]
name = "ex-after-inline-code"
