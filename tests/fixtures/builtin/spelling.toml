# spelling の例。期待値は、textlint 15.8.0 と textlint-rule-spelling 0.3.0 (nspell 2.1.5、dictionary-en 4.0.0) の実行結果から作った。
# jafixの照合は spellbook 0.4.2 で、辞書は同じ dictionary-en 4.0.0 のen_USである。辞書に当てる語は、nspellと spellbook の判定が同じ語だけにした。
# ファイルの先頭の builtin は候補を文面に出さない。候補を出すcaseの候補は spellbook のもので、nspellと並びが違うcaseには note を付けた。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所 (既定の除外、候補の並び、リンクと画像の title、本文でない箇所、位置の数え方) で、
# 期待値は設計の規則から決めた。
#
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を、builtin を持たない全caseに当てる
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)

builtin = 'spelling = { suggestCorrections = false }'

[[cases]]
name = "b-basic"
text = "I saw a pacakge here."
findings = ["1:9"]
messages = ["英語の辞書に無い語「pacakge」を使っている"]

