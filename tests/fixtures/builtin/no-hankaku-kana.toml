# no-hankaku-kana の例。期待値は、textlint 15.8.0 と textlint-rule-preset-ja-technical-writing 12.0.2 の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所である。
#
# name:     caseの名前
# builtin:  設定ファイルの [builtin] の表に書く内容 (省略可)
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    修正ルールだけが持つ。`jafix fix` の後の内容から、末尾の改行を除いたもの

[[cases]]
name = "hk-fix"
text = "ﾊﾝｶｸｶﾅとｶﾞｷﾞとﾊﾟ。"
findings = ["1:1", "1:8", "1:13"]
messages = ["半角カナを全角にする", "半角カナを全角にする", "半角カナを全角にする"]
fixed = "ハンカクカナとガギとパ。"

[[cases]]
name = "hk-punct"
text = "｢半角｣､句読点｡"
findings = ["1:1", "1:4", "1:9"]
fixed = "「半角」、句読点。"

[[cases]]
name = "hk-strong"
text = "**ﾊﾝｶｸ**です。"
findings = []
fixed = "**ﾊﾝｶｸ**です。"

[[cases]]
name = "hk-heading"
text = "# ﾊﾝｶｸ"
findings = []
fixed = "# ﾊﾝｶｸ"

[[cases]]
name = "hk-quote"
text = "> ﾊﾝｶｸです。"
findings = []
fixed = "> ﾊﾝｶｸです。"

[[cases]]
name = "hk-list"
text = "- ﾊﾝｶｸです。"
findings = ["1:3"]
fixed = "- ハンカクです。"

[[cases]]
name = "hk-span"
text = "<span>ﾊﾝｶｸ</span>です。"
findings = ["1:7"]
fixed = "<span>ハンカク</span>です。"
