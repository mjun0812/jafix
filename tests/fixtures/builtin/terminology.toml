# terminology の例。期待値は、textlint 15.8.0 と textlint-rule-terminology 5.2.16 の実行結果から作った。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所か、Markdownの解析の違いが出る箇所で、期待値は設計の規則から決めた。
# 利用者の `terms` の箇所は利用者の置き換え (修正ルール) で、組み込みの辞書の箇所は指摘である。
# jafixは、包む正規表現の直後の条件に、アポストロフィ `’` を除くASCIIでない文字 (日本語の文字や全角の記号) 1つを足す。
#
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を、builtin を持たない全caseに当てる
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘と箇所の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    `jafix fix` の後の内容から、末尾の改行を除いたもの。2回目の `jafix fix` で変わらないことも確かめる

builtin = 'terminology = true'

[[cases]]
name = "d-string-basic"
text = "We use github and json here."
findings = ["1:8", "1:19"]
messages = ["「github」を「GitHub」にする", "「json」を「JSON」にする"]

