[[cases]]
name = "u-text-start"
builtin = 'terminology = { terms = ["jafix"] }'
text = "JAFIX is here."
findings = ["1:1"]
messages = ["「JAFIX」を「Jafix」にする"]
fixed = "Jafix is here."

[[cases]]
name = "u-heading"
note = "見出しの中の利用者の置き換えは、直さずに指摘にする (prh と同じ)。textlintは直す"
builtin = 'terminology = { terms = ["Jafix"] }'
text = "# Use jafix\n\nUse jafix"
findings = ["1:7", "3:5"]
messages = ["「jafix」を「Jafix」にする。見出しのアンカーが変わるので、見出しへのリンクも直す", "「jafix」を「Jafix」にする"]
fixed = "# Use jafix\n\nUse Jafix"

[[cases]]
name = "u-newline-in-match"
note = "改行を含む利用者の置き換えは、直さずに指摘にする (prh と同じ)。textlintは直す"
builtin = 'terminology = { terms = [["foo\\sbar", "foobar"]], defaultTerms = false }'
text = "Use foo\nbar here."
findings = ["1:5"]
messages = ["「foo\\nbar」を「foobar」にする。改行を含むので直さない"]
fixed = "Use foo\nbar here."

[[cases]]
name = "u-newline-in-replacement"
note = "改行を含む利用者の置き換えは、直さずに指摘にする (prh と同じ)。textlintは直す"
builtin = 'terminology = { terms = [["foo", "foo\nbar"]], defaultTerms = false }'
text = "Use foo here."
findings = ["1:5"]
messages = ["「foo」を「foo\\nbar」にする。改行を含むので直さない"]
fixed = "Use foo here."

[[cases]]
name = "u-overlap"
note = "利用者の置き換えの重なりは、先に始まる箇所を残す。textlintは2件を出し、重ならないものから直す"
builtin = 'terminology = { terms = [["foo bar", "foobar"], ["bar baz", "barbaz"]], defaultTerms = false }'
text = "Use foo bar baz."
findings = ["1:5"]
messages = ["「foo bar」を「foobar」にする"]
fixed = "Use foobar baz."

[[cases]]
name = "u-same-range"
note = "同じ範囲の利用者の置き換えは、前の項目を残す。textlintは2件を出す"
builtin = 'terminology = { terms = [["foo", "bar"], ["foo", "baz"]], defaultTerms = false }'
text = "Use foo here."
findings = ["1:5"]
messages = ["「foo」を「bar」にする"]
fixed = "Use bar here."

[[cases]]
name = "u-unresolvable"
note = "文字列の項目の `.` が任意の文字に当たり、置き換え後の語を求められない一致は、指摘せずに続ける。textlintは例外で止まるので、かけない"
builtin = 'terminology = { terms = ["Node.js"], defaultTerms = false }'
text = "Use nodexjs and node.js."
findings = ["1:17"]
messages = ["「node.js」を「Node.js」にする"]
fixed = "Use nodexjs and Node.js."

[[cases]]
name = "u-blockquote"
builtin = 'terminology = { terms = ["Jafix"] }'
text = "> Use jafix here."
findings = []
fixed = "> Use jafix here."

[[cases]]
name = "u-multi-line"
builtin = 'terminology = { terms = ["Jafix"] }'
text = "Use jafix\nand jafix."
findings = ["1:5", "2:5"]
messages = ["「jafix」を「Jafix」にする", "「jafix」を「Jafix」にする"]
fixed = "Use Jafix\nand Jafix."

