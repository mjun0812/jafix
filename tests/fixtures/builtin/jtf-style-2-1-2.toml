# 2.1.2.漢字 の例。期待値は、textlint 15.8.0 と textlint-rule-preset-jtf-style 3.0.3 の実行結果から作った。textlintでは、presetの既定で無効なルールを `{}` で有効にした。
# note のあるcaseは、jafixがtextlintと意図して変えている箇所か、既存の修正ルールと組み合わさる箇所で、期待値は設計の規則から決めた。
#
# rule:     指摘の行の `[<rule-id>]` のID (fixtureのファイル名はIDを使えないので、ここに書く)
# name:     caseの名前
# note:     textlintと変える理由 (省略可)
# builtin:  設定ファイルの [builtin] の表に書く内容。ファイルの先頭に書いた分を全caseに当て、caseに書けばそちらだけを使う
# text:     入力。末尾に改行を1つ足したものを検査する
# findings: `jafix check` の出力のうち、このルールの指摘と箇所の位置 (行:列) を出力の順に並べたもの
# messages: findings と同じ順の文面 (省略可)
# fixed:    修正ルールだけが持つ。`jafix fix` の後の内容から、末尾の改行を除いたもの。2回目の `jafix fix` で変わらないことも確かめる

rule = "2.1.2.漢字"
builtin = '''
"2.1.2.漢字" = true
'''

[[cases]]
name = "kj-basic"
text = "彼は鬱で躓いた"
findings = ["1:5"]
messages = ["「躓」は常用漢字表にない漢字"]

[[cases]]
name = "kj-all-joyo"
text = "日本語の文字を書く"
findings = []

[[cases]]
name = "kj-kana-only"
text = "ひらがなとカタカナだけ"
findings = []

[[cases]]
name = "kj-each-char"
text = "躓鬱躓"
findings = ["1:1", "1:3"]
messages = ["「躓」は常用漢字表にない漢字", "「躓」は常用漢字表にない漢字"]

[[cases]]
name = "kj-old-form"
text = "圖書館の國"
findings = ["1:1", "1:5"]
messages = ["「圖」は常用漢字表にない漢字", "「國」は常用漢字表にない漢字"]

[[cases]]
name = "kj-repetition-mark-is-not-checked"
text = "人々と日々"
findings = []

[[cases]]
name = "kj-zero-and-closing-mark"
text = "〇と〻"
findings = ["1:1", "1:3"]
messages = ["「〇」は常用漢字表にない漢字", "「〻」は常用漢字表にない漢字"]

[[cases]]
name = "kj-extension-a"
text = "㐀と鬱"
findings = ["1:1"]
messages = ["「㐀」は常用漢字表にない漢字"]

[[cases]]
name = "kj-compatibility-kanji"
text = "豈と鬱"
findings = ["1:1"]
messages = ["「豈」は常用漢字表にない漢字"]

[[cases]]
name = "kj-kangxi-radical-is-not-kanji"
text = "⼀と鬱"
findings = []

[[cases]]
name = "kj-astral-at-start"
text = "\U00020bb7野家と鬱"
findings = ["1:1"]
messages = ["「\U00020bb7」は常用漢字表にない漢字"]

[[cases]]
name = "kj-position-after-surrogate-pair"
note = "位置は元のソースでの位置で、列は文字で数える。textlintは文字の添字をUTF-16の位置に使うので、サロゲートペアの後ろの字の列が1つ前にずれる"
text = "\U00020bb7野家と髙橋と々と〇"
findings = ["1:1", "1:5", "1:10"]
messages = ["「\U00020bb7」は常用漢字表にない漢字", "「髙」は常用漢字表にない漢字", "「〇」は常用漢字表にない漢字"]

[[cases]]
name = "kj-position-after-two-surrogate-pairs"
note = "サロゲートペアが2つ続くと、textlintの位置は2列前にずれる"
text = "\U00020bb7\U00020bb7躓と躓"
findings = ["1:1", "1:2", "1:3", "1:5"]
messages = ["「\U00020bb7」は常用漢字表にない漢字", "「\U00020bb7」は常用漢字表にない漢字", "「躓」は常用漢字表にない漢字", "「躓」は常用漢字表にない漢字"]

[[cases]]
name = "kj-position-after-surrogate-pair-alternating"
note = "位置は元のソースでの位置である。textlintは文字の添字をUTF-16の位置に使う"
text = "\U00020bb7髙\U00020bb7髙"
findings = ["1:1", "1:2", "1:3", "1:4"]
messages = ["「\U00020bb7」は常用漢字表にない漢字", "「髙」は常用漢字表にない漢字", "「\U00020bb7」は常用漢字表にない漢字", "「髙」は常用漢字表にない漢字"]

[[cases]]
name = "kj-two-lines"
text = "躓いた\n鬱と躓"
findings = ["1:1", "2:3"]
messages = ["「躓」は常用漢字表にない漢字", "「躓」は常用漢字表にない漢字"]

[[cases]]
name = "kj-alt-is-not-checked"
text = "![躓](a.png)"
findings = []

[[cases]]
name = "kj-reference-link-with-definition"
text = "[躓]\n\n[躓]: https://example.com"
findings = []

[[cases]]
name = "kj-heading"
text = "# 躓いた"
findings = []

[[cases]]
name = "kj-quote"
text = "> 躓いた"
findings = []

[[cases]]
name = "kj-table"
text = "| 列 |\n| - |\n| 躓いた |"
findings = []

[[cases]]
name = "kj-list"
text = "- 躓いた"
findings = ["1:3"]
messages = ["「躓」は常用漢字表にない漢字"]

[[cases]]
name = "kj-link"
text = "[躓いた](https://example.com)"
findings = []

[[cases]]
name = "kj-strong"
text = "**躓いた**"
findings = []

[[cases]]
name = "kj-emphasis"
text = "*躓いた*"
findings = []

[[cases]]
name = "kj-strike"
text = "~~躓いた~~"
findings = []

[[cases]]
name = "kj-code"
text = "`躓いた`"
findings = []

[[cases]]
name = "kj-footnote"
text = "[^1]: 躓いた"
findings = ["1:7"]
messages = ["「躓」は常用漢字表にない漢字"]

[[cases]]
name = "kj-html"
text = "<span>躓いた</span>"
findings = ["1:7"]
messages = ["「躓」は常用漢字表にない漢字"]
