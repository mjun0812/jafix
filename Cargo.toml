[package]
name = "jafix"
version = "0.1.0"
edition = "2024"
description = "Fix Japanese prose written by AI agents, from Claude Code and Codex hooks"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mjun0812/jafix"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.21"
markdown = "1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"
