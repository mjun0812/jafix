[package]
name = "jafix"
version = "0.0.4"
edition = "2024"
description = "Fix Japanese prose written by AI agents, from Claude Code and Codex hooks"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mjun0812/jafix"

[dependencies]
chardetng = "1.0.0"
clap = { version = "4.6.7", features = ["derive"] }
encoding_rs = "0.8.44"
foldhash = { version = "0.2.0", default-features = false }
globset = "0.4.21"
lindera = { version = "7.0.0", default-features = false, features = ["embed-ipadic"] }
markdown = "1"
regex = "1.13.1"
regress = "0.12.0"
rmcp = { version = "3.11.0", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
similar = "3.2.0"
spellbook = { version = "0.4.2", default-features = false }
tokio = { version = "1.54.1", features = ["rt"] }
toml = "1.2.1"
unicode-normalization = "0.1.26"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
